<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" role="img" aria-labelledby="t d">
  <title id="t">Active Directory Users and Computers console layout</title>
  <desc id="d">The ADUC console. A left navigation tree shows the domain vbunnylab.local with its built-in containers (Builtin, Computers, Domain Controllers, Users) and the custom VBunnyLab organisational unit selected, containing Accounting, HR, IT, Servers and Workstations. The right pane lists the contents of the selected OU with Name, Type and Description columns.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .win    { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .title  { fill: #eaeef2; }
    .strip  { fill: #f6f8fa; }
    .divide { stroke: #d0d7de; stroke-width: 1; }
    .sel    { fill: #cfe8ff; }
    .icon   { fill: #d8a657; }
    .iconb  { fill: #6e9fd8; }
    .icong  { fill: #7cb07c; }
    .chev   { fill: none; stroke: #656d76; stroke-width: 1.3; }
    .wtitle { fill: #1f2328; font-size: 12.5px; font-weight: 600; }
    .menu   { fill: #424a53; font-size: 11.5px; }
    .tree   { fill: #1f2328; font-size: 11.5px; }
    .treesel{ fill: #0a3069; font-size: 11.5px; font-weight: 600; }
    .col    { fill: #424a53; font-size: 11px; font-weight: 600; }
    .cell   { fill: #1f2328; font-size: 11.5px; }
    .dim    { fill: #656d76; font-size: 11px; }
    .badge  { fill: #8250df; }
    .bnum   { fill: #ffffff; font-size: 10px; font-weight: 700; }
    .legend { fill: #424a53; font-size: 11.5px; }
    .cap    { fill: #656d76; font-size: 11px; font-style: italic; }
    .hdr    { fill: #1f2328; font-size: 13.5px; font-weight: 600; }

    @media (prefers-color-scheme: dark) {
      .win    { fill: #161b22; stroke: #484f58; }
      .title  { fill: #21262d; }
      .strip  { fill: #0d1117; }
      .divide { stroke: #30363d; }
      .sel    { fill: #163a63; }
      .icon   { fill: #d8a657; }
      .iconb  { fill: #58a6ff; }
      .icong  { fill: #3fb950; }
      .chev   { stroke: #8b949e; }
      .wtitle { fill: #e6edf3; }
      .menu   { fill: #b1bac4; }
      .tree   { fill: #e6edf3; }
      .treesel{ fill: #cae8ff; }
      .col    { fill: #b1bac4; }
      .cell   { fill: #e6edf3; }
      .dim    { fill: #8b949e; }
      .badge  { fill: #bc8cff; }
      .bnum   { fill: #0d1117; }
      .legend { fill: #b1bac4; }
      .cap    { fill: #8b949e; }
      .hdr    { fill: #e6edf3; }
    }
  </style>

  <text class="hdr" x="20" y="26">Active Directory Users and Computers  -  dsa.msc</text>

  <!-- window -->
  <rect class="win" x="20" y="40" width="740" height="400" rx="5"/>
  <path class="title" d="M20 45 a5 5 0 0 1 5 -5 h730 a5 5 0 0 1 5 5 v25 h-740 z"/>
  <text class="wtitle" x="36" y="62">Active Directory Users and Computers</text>
  <text class="dim" x="700" y="62">_  []  X</text>
  <line class="divide" x1="20" y1="70" x2="760" y2="70"/>

  <!-- menu bar -->
  <text class="menu" x="36"  y="88">File</text>
  <text class="menu" x="74"  y="88">Action</text>
  <text class="menu" x="130" y="88">View</text>
  <text class="menu" x="176" y="88">Help</text>
  <line class="divide" x1="20" y1="96" x2="760" y2="96"/>

  <!-- toolbar -->
  <rect class="strip" x="21" y="97" width="738" height="26"/>
  <rect class="iconb" x="36"  y="104" width="12" height="12" rx="2"/>
  <rect class="iconb" x="54"  y="104" width="12" height="12" rx="2"/>
  <rect class="icon"  x="80"  y="104" width="12" height="12" rx="2"/>
  <rect class="icon"  x="98"  y="104" width="12" height="12" rx="2"/>
  <rect class="icong" x="124" y="104" width="12" height="12" rx="2"/>
  <line class="divide" x1="20" y1="123" x2="760" y2="123"/>

  <!-- pane divider -->
  <line class="divide" x1="272" y1="123" x2="272" y2="440"/>

  <!-- ===== tree ===== -->
  <rect class="sel" x="21" y="290" width="250" height="20"/>

  <path class="chev" d="M32 142 l5 4 l-5 4"/>
  <rect class="iconb" x="42" y="140" width="11" height="9" rx="1.5"/>
  <text class="tree" x="59" y="149">AD Users and Computers [DC01]</text>

  <rect class="icon" x="56" y="162" width="11" height="9" rx="1.5"/>
  <text class="tree" x="73" y="171">Saved Queries</text>

  <path class="chev" d="M46 184 l5 4 l-5 4"/>
  <rect class="iconb" x="56" y="184" width="11" height="9" rx="1.5"/>
  <text class="tree" x="73" y="193">vbunnylab.local</text>
  <circle class="badge" cx="250" cy="189" r="9"/>
  <text class="bnum" x="250" y="193" text-anchor="middle">1</text>

  <rect class="icon" x="70" y="206" width="11" height="9" rx="1.5"/>
  <text class="tree" x="87" y="215">Builtin</text>

  <rect class="icon" x="70" y="228" width="11" height="9" rx="1.5"/>
  <text class="tree" x="87" y="237">Computers</text>

  <rect class="icon" x="70" y="250" width="11" height="9" rx="1.5"/>
  <text class="tree" x="87" y="259">Domain Controllers</text>

  <rect class="icon" x="70" y="272" width="11" height="9" rx="1.5"/>
  <text class="tree" x="87" y="281">Users</text>

  <path class="chev" d="M60 294 l5 4 l-5 4"/>
  <rect class="icong" x="70" y="294" width="11" height="9" rx="1.5"/>
  <text class="treesel" x="87" y="303">VBunnyLab</text>
  <circle class="badge" cx="250" cy="300" r="9"/>
  <text class="bnum" x="250" y="304" text-anchor="middle">2</text>

  <rect class="icong" x="84" y="316" width="11" height="9" rx="1.5"/>
  <text class="tree" x="101" y="325">Accounting</text>

  <rect class="icong" x="84" y="338" width="11" height="9" rx="1.5"/>
  <text class="tree" x="101" y="347">HR</text>

  <rect class="icong" x="84" y="360" width="11" height="9" rx="1.5"/>
  <text class="tree" x="101" y="369">IT</text>

  <rect class="icong" x="84" y="382" width="11" height="9" rx="1.5"/>
  <text class="tree" x="101" y="391">Servers</text>

  <rect class="icong" x="84" y="404" width="11" height="9" rx="1.5"/>
  <text class="tree" x="101" y="413">Workstations</text>

  <!-- ===== list view ===== -->
  <rect class="strip" x="273" y="124" width="486" height="24"/>
  <text class="col" x="292" y="140">Name</text>
  <text class="col" x="452" y="140">Type</text>
  <text class="col" x="608" y="140">Description</text>
  <line class="divide" x1="272" y1="148" x2="760" y2="148"/>
  <line class="divide" x1="444" y1="124" x2="444" y2="440"/>
  <line class="divide" x1="600" y1="124" x2="600" y2="440"/>

  <circle class="badge" cx="740" cy="140" r="9"/>
  <text class="bnum" x="740" y="144" text-anchor="middle">3</text>

  <rect class="icong" x="292" y="164" width="11" height="9" rx="1.5"/>
  <text class="cell" x="309" y="173">Accounting</text>
  <text class="cell" x="452" y="173">Organizational Unit</text>
  <text class="dim"  x="608" y="173">Accounting staff</text>

  <rect class="icong" x="292" y="192" width="11" height="9" rx="1.5"/>
  <text class="cell" x="309" y="201">HR</text>
  <text class="cell" x="452" y="201">Organizational Unit</text>
  <text class="dim"  x="608" y="201">HR staff</text>

  <rect class="icong" x="292" y="220" width="11" height="9" rx="1.5"/>
  <text class="cell" x="309" y="229">IT</text>
  <text class="cell" x="452" y="229">Organizational Unit</text>
  <text class="dim"  x="608" y="229">IT staff</text>

  <rect class="icong" x="292" y="248" width="11" height="9" rx="1.5"/>
  <text class="cell" x="309" y="257">Servers</text>
  <text class="cell" x="452" y="257">Organizational Unit</text>
  <text class="dim"  x="608" y="257">Member servers</text>

  <rect class="icong" x="292" y="276" width="11" height="9" rx="1.5"/>
  <text class="cell" x="309" y="285">Workstations</text>
  <text class="cell" x="452" y="285">Organizational Unit</text>
  <text class="dim"  x="608" y="285">Domain-joined clients</text>

  <!-- ===== legend ===== -->
  <circle class="badge" cx="29" cy="462" r="9"/>
  <text class="bnum" x="29" y="466" text-anchor="middle">1</text>
  <text class="legend" x="44" y="466">Domain root</text>

  <circle class="badge" cx="170" cy="462" r="9"/>
  <text class="bnum" x="170" y="466" text-anchor="middle">2</text>
  <text class="legend" x="185" y="466">Custom OU - where user objects belong</text>

  <circle class="badge" cx="470" cy="462" r="9"/>
  <text class="bnum" x="470" y="466" text-anchor="middle">3</text>
  <text class="legend" x="485" y="466">Contents of the selected OU</text>

  <text class="cap" x="20" y="490"></text>
</svg>
