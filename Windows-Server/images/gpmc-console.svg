<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" role="img" aria-labelledby="t d">
  <title id="t">Group Policy Management Console layout</title>
  <desc id="d">The Group Policy Management Console. The left tree shows Forest vbunnylab.local, Domains, the domain node with Default Domain Policy, the VBunnyLab organisational unit with a linked firewall baseline GPO selected, and the Group Policy Objects container. The right pane shows the Scope tab with the link location and the Security Filtering list, alongside the Delegation tab used to restore read access for Domain Computers.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .win    { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .title  { fill: #eaeef2; }
    .strip  { fill: #f6f8fa; }
    .box    { fill: #fbfcfd; stroke: #d0d7de; stroke-width: 1; }
    .btn    { fill: #f6f8fa; stroke: #afb8c1; stroke-width: 1; }
    .divide { stroke: #d0d7de; stroke-width: 1; }
    .sel    { fill: #cfe8ff; }
    .tabsel { stroke: #0969da; stroke-width: 2.5; }
    .icon   { fill: #d8a657; }
    .iconb  { fill: #6e9fd8; }
    .icong  { fill: #7cb07c; }
    .iconp  { fill: #a67cd8; }
    .chev   { fill: none; stroke: #656d76; stroke-width: 1.3; }
    .wtitle { fill: #1f2328; font-size: 12.5px; font-weight: 600; }
    .menu   { fill: #424a53; font-size: 11.5px; }
    .tree   { fill: #1f2328; font-size: 11.5px; }
    .treesel{ fill: #0a3069; font-size: 11.5px; font-weight: 600; }
    .ptitle { fill: #1f2328; font-size: 12.5px; font-weight: 600; }
    .tab    { fill: #424a53; font-size: 11.5px; }
    .tabon  { fill: #0969da; font-size: 11.5px; font-weight: 600; }
    .lbl    { fill: #1f2328; font-size: 11.5px; font-weight: 600; }
    .cell   { fill: #1f2328; font-size: 11.5px; }
    .dim    { fill: #656d76; font-size: 11px; }
    .badge  { fill: #8250df; }
    .bnum   { fill: #ffffff; font-size: 10px; font-weight: 700; }
    .legend { fill: #424a53; font-size: 11.5px; }
    .cap    { fill: #656d76; font-size: 11px; font-style: italic; }
    .hdr    { fill: #1f2328; font-size: 13.5px; font-weight: 600; }

    @media (prefers-color-scheme: dark) {
      .win    { fill: #161b22; stroke: #484f58; }
      .title  { fill: #21262d; }
      .strip  { fill: #0d1117; }
      .box    { fill: #0d1117; stroke: #30363d; }
      .btn    { fill: #21262d; stroke: #484f58; }
      .divide { stroke: #30363d; }
      .sel    { fill: #163a63; }
      .tabsel { stroke: #58a6ff; }
      .iconb  { fill: #58a6ff; }
      .icong  { fill: #3fb950; }
      .iconp  { fill: #bc8cff; }
      .chev   { stroke: #8b949e; }
      .wtitle { fill: #e6edf3; }
      .menu   { fill: #b1bac4; }
      .tree   { fill: #e6edf3; }
      .treesel{ fill: #cae8ff; }
      .ptitle { fill: #e6edf3; }
      .tab    { fill: #b1bac4; }
      .tabon  { fill: #58a6ff; }
      .lbl    { fill: #e6edf3; }
      .cell   { fill: #e6edf3; }
      .dim    { fill: #8b949e; }
      .badge  { fill: #bc8cff; }
      .bnum   { fill: #0d1117; }
      .legend { fill: #b1bac4; }
      .cap    { fill: #8b949e; }
      .hdr    { fill: #e6edf3; }
    }
  </style>

  <text class="hdr" x="20" y="26">Group Policy Management  -  gpmc.msc</text>

  <rect class="win" x="20" y="40" width="740" height="424" rx="5"/>
  <path class="title" d="M20 45 a5 5 0 0 1 5 -5 h730 a5 5 0 0 1 5 5 v25 h-740 z"/>
  <text class="wtitle" x="36" y="62">Group Policy Management</text>
  <text class="dim" x="700" y="62">_  []  X</text>
  <line class="divide" x1="20" y1="70" x2="760" y2="70"/>

  <text class="menu" x="36"  y="88">File</text>
  <text class="menu" x="74"  y="88">Action</text>
  <text class="menu" x="130" y="88">View</text>
  <text class="menu" x="176" y="88">Window</text>
  <text class="menu" x="238" y="88">Help</text>
  <line class="divide" x1="20" y1="96" x2="760" y2="96"/>
  <rect class="strip" x="21" y="97" width="738" height="24"/>
  <line class="divide" x1="20" y1="121" x2="760" y2="121"/>
  <line class="divide" x1="296" y1="121" x2="296" y2="464"/>

  <!-- ===== tree ===== -->
  <rect class="sel" x="21" y="264" width="274" height="20"/>

  <path class="chev" d="M32 138 l5 4 l-5 4"/>
  <rect class="iconb" x="42" y="137" width="11" height="9" rx="1.5"/>
  <text class="tree" x="59" y="146">Group Policy Management</text>

  <path class="chev" d="M46 160 l5 4 l-5 4"/>
  <rect class="iconb" x="56" y="159" width="11" height="9" rx="1.5"/>
  <text class="tree" x="73" y="168">Forest: vbunnylab.local</text>

  <path class="chev" d="M60 182 l5 4 l-5 4"/>
  <rect class="icon" x="70" y="181" width="11" height="9" rx="1.5"/>
  <text class="tree" x="87" y="190">Domains</text>

  <path class="chev" d="M74 204 l5 4 l-5 4"/>
  <rect class="iconb" x="84" y="203" width="11" height="9" rx="1.5"/>
  <text class="tree" x="101" y="212">vbunnylab.local</text>

  <rect class="iconp" x="98" y="225" width="11" height="9" rx="1.5"/>
  <text class="tree" x="115" y="234">Default Domain Policy</text>

  <path class="chev" d="M88 248 l5 4 l-5 4"/>
  <rect class="icong" x="98" y="247" width="11" height="9" rx="1.5"/>
  <text class="tree" x="115" y="256">VBunnyLab</text>

  <rect class="iconp" x="112" y="269" width="11" height="9" rx="1.5"/>
  <text class="treesel" x="129" y="278">VBunnyLab-Firewall</text>
  <circle class="badge" cx="278" cy="274" r="9"/>
  <text class="bnum" x="278" y="278" text-anchor="middle">1</text>

  <rect class="icon" x="98" y="291" width="11" height="9" rx="1.5"/>
  <text class="tree" x="115" y="300">Group Policy Objects</text>

  <rect class="icon" x="98" y="313" width="11" height="9" rx="1.5"/>
  <text class="tree" x="115" y="322">WMI Filters</text>

  <rect class="icon" x="98" y="335" width="11" height="9" rx="1.5"/>
  <text class="tree" x="115" y="344">Starter GPOs</text>

  <rect class="icon" x="70" y="357" width="11" height="9" rx="1.5"/>
  <text class="tree" x="87" y="366">Sites</text>

  <rect class="iconb" x="56" y="379" width="11" height="9" rx="1.5"/>
  <text class="tree" x="73" y="388">Group Policy Modeling</text>

  <rect class="iconb" x="56" y="401" width="11" height="9" rx="1.5"/>
  <text class="tree" x="73" y="410">Group Policy Results</text>

  <!-- ===== right pane ===== -->
  <text class="ptitle" x="312" y="144">VBunnyLab-Firewall-Baseline</text>

  <!-- tabs -->
  <text class="tabon" x="312" y="172">Scope</text>
  <text class="tab"   x="368" y="172">Details</text>
  <text class="tab"   x="428" y="172">Settings</text>
  <text class="tab"   x="494" y="172">Delegation</text>
  <line class="tabsel" x1="310" y1="180" x2="352" y2="180"/>
  <line class="divide" x1="296" y1="180" x2="760" y2="180"/>
  <circle class="badge" cx="578" cy="168" r="9"/>
  <text class="bnum" x="578" y="172" text-anchor="middle">3</text>

  <!-- links -->
  <text class="lbl" x="312" y="206">Links</text>
  <text class="dim" x="312" y="224">Display links in this location:</text>
  <rect class="box" x="312" y="234" width="430" height="46" rx="3"/>
  <rect class="icong" x="324" y="250" width="11" height="9" rx="1.5"/>
  <text class="cell" x="341" y="259">OU=Workstations,OU=VBunnyLab</text>

  <!-- security filtering -->
  <text class="lbl" x="312" y="308">Security Filtering</text>
  <text class="dim" x="312" y="326">The settings in this GPO can only apply to the following:</text>
  <rect class="box" x="312" y="336" width="430" height="64" rx="3"/>
  <rect class="iconb" x="324" y="352" width="11" height="9" rx="1.5"/>
  <text class="cell" x="341" y="361">Authenticated Users</text>
  <circle class="badge" cx="726" cy="356" r="9"/>
  <text class="bnum" x="726" y="360" text-anchor="middle">2</text>

  <rect class="btn" x="312" y="414" width="64" height="24" rx="3"/>
  <text class="cell" x="344" y="430" text-anchor="middle">Add</text>
  <rect class="btn" x="386" y="414" width="76" height="24" rx="3"/>
  <text class="cell" x="424" y="430" text-anchor="middle">Remove</text>
  <rect class="btn" x="472" y="414" width="84" height="24" rx="3"/>
  <text class="cell" x="514" y="430" text-anchor="middle">Properties</text>

  <!-- ===== legend ===== -->
  <circle class="badge" cx="29" cy="486" r="9"/>
  <text class="bnum" x="29" y="490" text-anchor="middle">1</text>
  <text class="legend" x="44" y="490">GPO linked at the OU</text>

  <circle class="badge" cx="214" cy="486" r="9"/>
  <text class="bnum" x="214" y="490" text-anchor="middle">2</text>
  <text class="legend" x="229" y="490">Who it applies to</text>

  <circle class="badge" cx="374" cy="486" r="9"/>
  <text class="bnum" x="374" y="490" text-anchor="middle">3</text>
  <text class="legend" x="389" y="490">Delegation - grant Domain Computers Read here (MS16-072)</text>

  <text class="cap" x="20" y="512"></text>
</svg>
