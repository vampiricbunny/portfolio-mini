<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d">
  <title id="t">MITRE ATT&amp;CK Navigator coverage layer, drawn layout</title>
  <desc id="d">A drawn representation of the ATT&amp;CK Navigator. Columns are tactics: Initial Access, Execution, Persistence, Privilege Escalation, Defense Evasion, Credential Access, Discovery, Lateral Movement, Collection, Command and Control, Exfiltration. Each column holds technique cells coloured green where a detection exists, amber where partial, and red or grey where there is no coverage. The Collection and Exfiltration columns are entirely grey. A footer states this is a schematic illustration and not a screen capture, and that the layer is generated automatically from the detection rules' ATT&amp;CK tags.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .win { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .bar { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .col { fill: #656d76; font-size: 8.5px; font-weight: 700; text-anchor: middle; }
    .cov { fill: #2ea043; stroke: #ffffff; stroke-width: 1; }
    .par { fill: #d4a72c; stroke: #ffffff; stroke-width: 1; }
    .non { fill: #e6e9ec; stroke: #ffffff; stroke-width: 1; }
    .h1  { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub { fill: #656d76; font-size: 11px; }
    .foot{ fill: #656d76; font-size: 10px; font-style: italic; }
    .k   { fill: #424a53; font-size: 10px; }
    @media (prefers-color-scheme: dark) {
      .win { fill: #0d1117; stroke: #30363d; } .bar { fill: #161b22; stroke: #30363d; }
      .col { fill: #8b949e; } .cov { fill: #2d7d3f; stroke: #0d1117; }
      .par { fill: #b5851d; stroke: #0d1117; } .non { fill: #21262d; stroke: #0d1117; }
      .h1  { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } .k { fill: #b1bac4; }
    }
  </style>
  <text class="h1"  x="24" y="28">ATT&amp;CK Navigator  ·  coverage layer</text>
  <text class="sub" x="24" y="47">Generated from the detection rules' tags, so the map matches reality.</text>

  <rect class="win" x="24" y="60" width="812" height="330" rx="6"/>
  <rect class="bar" x="24" y="60" width="812" height="26" rx="6"/>
  <text class="sub" x="38" y="78">layer: Detection Coverage   green = detected   amber = partial   grey = none</text>

  <!-- 11 columns, each ~72 wide starting x=32 -->
  <!-- helper: draw headers and cells -->
  <!-- Column headers -->
  <text class="col" x="70"  y="104">Initial</text><text class="col" x="70" y="114">Access</text>
  <text class="col" x="142" y="104">Execution</text>
  <text class="col" x="214" y="104">Persist</text>
  <text class="col" x="286" y="104">Priv Esc</text>
  <text class="col" x="358" y="104">Def Evade</text>
  <text class="col" x="430" y="104">Cred</text><text class="col" x="430" y="114">Access</text>
  <text class="col" x="502" y="104">Discovery</text>
  <text class="col" x="574" y="104">Lateral</text>
  <text class="col" x="646" y="104">Collect</text>
  <text class="col" x="718" y="104">C2</text>
  <text class="col" x="790" y="104">Exfil</text>

  <!-- Initial Access col x=40 -->
  <rect class="par" x="40" y="124" width="60" height="20" rx="2"/>
  <rect class="par" x="40" y="148" width="60" height="20" rx="2"/>
  <rect class="non" x="40" y="172" width="60" height="20" rx="2"/>
  <!-- Execution x=112 -->
  <rect class="cov" x="112" y="124" width="60" height="20" rx="2"/>
  <rect class="cov" x="112" y="148" width="60" height="20" rx="2"/>
  <rect class="cov" x="112" y="172" width="60" height="20" rx="2"/>
  <rect class="cov" x="112" y="196" width="60" height="20" rx="2"/>
  <rect class="cov" x="112" y="220" width="60" height="20" rx="2"/>
  <!-- Persistence x=184 -->
  <rect class="cov" x="184" y="124" width="60" height="20" rx="2"/>
  <rect class="cov" x="184" y="148" width="60" height="20" rx="2"/>
  <rect class="cov" x="184" y="172" width="60" height="20" rx="2"/>
  <rect class="cov" x="184" y="196" width="60" height="20" rx="2"/>
  <!-- Priv Esc x=256 -->
  <rect class="par" x="256" y="124" width="60" height="20" rx="2"/>
  <rect class="cov" x="256" y="148" width="60" height="20" rx="2"/>
  <rect class="non" x="256" y="172" width="60" height="20" rx="2"/>
  <!-- Defense Evasion x=328 -->
  <rect class="cov" x="328" y="124" width="60" height="20" rx="2"/>
  <rect class="cov" x="328" y="148" width="60" height="20" rx="2"/>
  <rect class="cov" x="328" y="172" width="60" height="20" rx="2"/>
  <rect class="par" x="328" y="196" width="60" height="20" rx="2"/>
  <!-- Cred Access x=400 -->
  <rect class="cov" x="400" y="124" width="60" height="20" rx="2"/>
  <rect class="cov" x="400" y="148" width="60" height="20" rx="2"/>
  <rect class="cov" x="400" y="172" width="60" height="20" rx="2"/>
  <rect class="cov" x="400" y="196" width="60" height="20" rx="2"/>
  <!-- Discovery x=472 -->
  <rect class="par" x="472" y="124" width="60" height="20" rx="2"/>
  <rect class="non" x="472" y="148" width="60" height="20" rx="2"/>
  <rect class="non" x="472" y="172" width="60" height="20" rx="2"/>
  <!-- Lateral x=544 -->
  <rect class="cov" x="544" y="124" width="60" height="20" rx="2"/>
  <rect class="cov" x="544" y="148" width="60" height="20" rx="2"/>
  <rect class="par" x="544" y="172" width="60" height="20" rx="2"/>
  <!-- Collection x=616 all grey -->
  <rect class="non" x="616" y="124" width="60" height="20" rx="2"/>
  <rect class="non" x="616" y="148" width="60" height="20" rx="2"/>
  <rect class="non" x="616" y="172" width="60" height="20" rx="2"/>
  <!-- C2 x=688 -->
  <rect class="par" x="688" y="124" width="60" height="20" rx="2"/>
  <rect class="cov" x="688" y="148" width="60" height="20" rx="2"/>
  <rect class="non" x="688" y="172" width="60" height="20" rx="2"/>
  <!-- Exfil x=760 all grey -->
  <rect class="non" x="760" y="124" width="60" height="20" rx="2"/>
  <rect class="non" x="760" y="148" width="60" height="20" rx="2"/>
  <rect class="non" x="760" y="172" width="60" height="20" rx="2"/>

  <!-- key -->
  <rect class="cov" x="40" y="352" width="14" height="14" rx="2"/><text class="k" x="60" y="364">detected</text>
  <rect class="par" x="150" y="352" width="14" height="14" rx="2"/><text class="k" x="170" y="364">partial</text>
  <rect class="non" x="250" y="352" width="14" height="14" rx="2"/><text class="k" x="270" y="364">no coverage</text>

  <text class="foot" x="24" y="418">Schematic illustration of the Navigator layout, not a screen capture.</text>
  <text class="sub"  x="24" y="440">The Collection and Exfiltration columns are entirely grey. Both need data sources the lab does not have.</text>
  <text class="sub"  x="24" y="458">The layer is generated from the rules' ATT&amp;CK tags, so it updates automatically when a rule is added or retired.</text>
</svg>
