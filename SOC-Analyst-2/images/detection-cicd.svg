<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="t d">
  <title id="t">The detection-as-code pipeline from commit to deployment</title>
  <desc id="d">A detection engineer writes a Sigma rule and its positive and negative tests, then commits to git and opens a pull request. Continuous integration lints the rule, converts it to both Wazuh and Sentinel, and runs the tests. On a pull request it stops there as a review gate. On merge to the main branch it deploys to both SIEMs, but only after validation passed. Finally the deployed rule is validated with an emulated attack. Nothing reaches production without passing the tests.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .write { fill: #ecd8ff; stroke: #8250df; stroke-width: 1.5; }
    .ci    { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
    .gate  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .deploy{ fill: #dafbe1; stroke: #2ea043; stroke-width: 1.5; }
    .siem  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .flow  { stroke: #656d76; stroke-width: 1.8; marker-end: url(#a); fill: none; }
    .arrow { fill: #656d76; }
    .h1    { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub   { fill: #656d76; font-size: 11.5px; }
    .t     { fill: #1f2328; font-size: 12.5px; font-weight: 700; }
    .d     { fill: #424a53; font-size: 10.5px; }
    .lbl   { fill: #656d76; font-size: 10px; font-weight: 600; }
    .stop  { fill: #cf222e; font-size: 10.5px; font-weight: 600; }
    .go    { fill: #1a7f37; font-size: 10.5px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .write { fill: #3c1e70; stroke: #bc8cff; }
      .ci    { fill: #4a3808; stroke: #d29922; }
      .gate  { fill: #3c1618; stroke: #f85149; }
      .deploy{ fill: #0f2f17; stroke: #3fb950; }
      .siem  { fill: #0c2d6b; stroke: #58a6ff; }
      .flow  { stroke: #8b949e; } .arrow { fill: #8b949e; }
      .h1    { fill: #e6edf3; } .sub { fill: #8b949e; }
      .t     { fill: #e6edf3; } .d { fill: #b1bac4; }
      .lbl   { fill: #8b949e; } .stop { fill: #ff7b72; } .go { fill: #3fb950; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker></defs>
  <text class="h1"  x="28" y="32">Detection as code</text>
  <text class="sub" x="28" y="54">A human writes and reviews. A machine checks, converts, tests, and deploys.</text>

  <rect class="write" x="28" y="80" width="200" height="70" rx="7"/>
  <text class="t" x="44" y="104">Write Sigma + tests</text>
  <text class="d" x="44" y="124">One rule, two products</text>
  <text class="d" x="44" y="140">Positive and negative test</text>

  <line class="flow" x1="228" y1="115" x2="266" y2="115"/>
  <text class="lbl" x="232" y="108">commit</text>

  <rect class="ci" x="270" y="80" width="240" height="70" rx="7"/>
  <text class="t" x="286" y="104">CI runs</text>
  <text class="d" x="286" y="124">lint  ->  convert to both  ->  test</text>
  <text class="d" x="286" y="140">positive must match, negative must not</text>

  <!-- pull request gate -->
  <line class="flow" x1="390" y1="150" x2="390" y2="196"/>
  <rect class="gate" x="270" y="200" width="240" height="56" rx="7"/>
  <text class="t"    x="286" y="224">Pull request: stop here</text>
  <text class="stop" x="286" y="244">review gate, no deploy</text>

  <!-- merge path -->
  <line class="flow" x1="510" y1="115" x2="556" y2="115"/>
  <text class="go" x="512" y="108">on merge</text>

  <rect class="deploy" x="560" y="80" width="230" height="70" rx="7"/>
  <text class="t" x="576" y="104">Deploy</text>
  <text class="d" x="576" y="124">only after tests pass</text>
  <text class="d" x="576" y="140">to both SIEMs, automatically</text>

  <line class="flow" x1="630" y1="150" x2="630" y2="186"/>
  <rect class="siem" x="560" y="190" width="110" height="42" rx="6"/>
  <text class="t" x="586" y="216">Wazuh</text>
  <rect class="siem" x="680" y="190" width="110" height="42" rx="6"/>
  <text class="t" x="700" y="216">Sentinel</text>

  <line class="flow" x1="625" y1="232" x2="625" y2="286"/>
  <rect class="ci" x="500" y="290" width="290" height="50" rx="7"/>
  <text class="t" x="516" y="313">Validate with an emulated attack</text>
  <text class="d" x="516" y="330">prove it actually fires (module 05)</text>

  <text class="sub" x="28" y="300">Nothing reaches production</text>
  <text class="sub" x="28" y="318">without passing the tests.</text>
  <text class="sub" x="28" y="336">That is the guarantee the</text>
  <text class="sub" x="28" y="354">pipeline provides.</text>

  <text class="sub" x="28" y="398">The same source file becomes a Wazuh rule and a Sentinel analytics rule. Change the logic once, both update.</text>
</svg>
