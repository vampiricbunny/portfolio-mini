<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="t d">
  <title id="t">The detection engineering lifecycle</title>
  <desc id="d">A detection has a lifecycle, not a single moment of creation. Idea leads to writing it as Sigma, then testing, then deploying, then tuning, then measuring, then either retiring or improving it, which loops back to testing. The point is that a detection is managed over time, which is the Tier 2 job.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.5; }
    .end  { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.5; }
    .flow { stroke: #656d76; stroke-width: 1.8; marker-end: url(#a); fill: none; }
    .loop { stroke: #d4a72c; stroke-width: 1.8; marker-end: url(#y); fill: none; stroke-dasharray: 5 3; }
    .arrow{ fill: #656d76; } .ay { fill: #d4a72c; }
    .h1   { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub  { fill: #656d76; font-size: 11.5px; }
    .t    { fill: #1f2328; font-size: 12px; font-weight: 700; }
    .lt   { fill: #9a6700; font-size: 10.5px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #0c2d6b; stroke: #58a6ff; }
      .end  { fill: #0f2f17; stroke: #3fb950; }
      .flow { stroke: #8b949e; } .loop { stroke: #d29922; }
      .arrow{ fill: #8b949e; } .ay { fill: #d29922; }
      .h1   { fill: #e6edf3; } .sub { fill: #8b949e; }
      .t    { fill: #e6edf3; } .lt { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="ay"/></marker>
  </defs>
  <text class="h1"  x="28" y="32">The detection lifecycle</text>
  <text class="sub" x="28" y="54">A detection is managed over time, not written once. That management is the Tier 2 job.</text>

  <rect class="box" x="28"  y="92" width="96" height="48" rx="7"/>
  <text class="t" x="58" y="121">Idea</text>
  <rect class="box" x="152" y="92" width="110" height="48" rx="7"/>
  <text class="t" x="168" y="121">Write Sigma</text>
  <rect class="box" x="290" y="92" width="88" height="48" rx="7"/>
  <text class="t" x="316" y="121">Test</text>
  <rect class="box" x="406" y="92" width="96" height="48" rx="7"/>
  <text class="t" x="428" y="121">Deploy</text>
  <rect class="box" x="530" y="92" width="88" height="48" rx="7"/>
  <text class="t" x="556" y="121">Tune</text>
  <rect class="box" x="646" y="92" width="104" height="48" rx="7"/>
  <text class="t" x="672" y="121">Measure</text>

  <line class="flow" x1="124" y1="116" x2="150" y2="116"/>
  <line class="flow" x1="262" y1="116" x2="288" y2="116"/>
  <line class="flow" x1="378" y1="116" x2="404" y2="116"/>
  <line class="flow" x1="502" y1="116" x2="528" y2="116"/>
  <line class="flow" x1="618" y1="116" x2="644" y2="116"/>

  <rect class="end" x="590" y="200" width="200" height="48" rx="7"/>
  <text class="t" x="606" y="229">Retire or improve</text>

  <line class="flow" x1="698" y1="140" x2="698" y2="198"/>
  <path class="loop" d="M 590 224 C 340 224, 334 170, 334 142" fill="none"/>
  <text class="lt" x="360" y="200">improve loops back to test</text>

  <text class="sub" x="28" y="284">Every stage in this project is documented with the tooling that supports it: Sigma to write, CI to test, a pipeline to deploy.</text>
</svg>
