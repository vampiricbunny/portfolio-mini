<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t d">
  <title id="t">The threat hunting loop</title>
  <desc id="d">Five steps in a loop. One, a hypothesis, a specific testable statement about an attacker. Two, data, what logs would show it and whether we have them. Three, hunt, query pivot and analyse. Four, finding, which is compromise, no compromise, or inconclusive. Five, improve, turning a successful hunt into an automatic detection. Then back to a new hypothesis. A note states the loop closes on step five, because a hunt you cannot turn into a detection is one you run by hand forever.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .n1 { fill: #ecd8ff; stroke: #8250df; stroke-width: 1.7; }
    .n2 { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.7; }
    .n3 { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.7; }
    .n4 { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.7; }
    .n5 { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.7; }
    .flow { stroke: #656d76; stroke-width: 2; marker-end: url(#a); fill: none; }
    .arrow { fill: #656d76; }
    .h1 { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub { fill: #656d76; font-size: 11.5px; }
    .num { fill: #ffffff; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .numbg { fill: #1f2328; }
    .t { fill: #1f2328; font-size: 12.5px; font-weight: 700; }
    .d { fill: #424a53; font-size: 10px; }
    @media (prefers-color-scheme: dark) {
      .n1 { fill: #3c1e70; stroke: #bc8cff; } .n2 { fill: #0c2d6b; stroke: #58a6ff; }
      .n3 { fill: #4a3808; stroke: #d29922; } .n4 { fill: #3c1618; stroke: #f85149; }
      .n5 { fill: #0f2f17; stroke: #3fb950; }
      .flow { stroke: #8b949e; } .arrow { fill: #8b949e; }
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; }
      .numbg { fill: #e6edf3; } .num { fill: #0d1117; }
      .t { fill: #e6edf3; } .d { fill: #b1bac4; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker></defs>
  <text class="h1"  x="28" y="32">The hunt loop</text>
  <text class="sub" x="28" y="54">Every hunt follows these five steps. The loop closes on step five.</text>

  <!-- 1 hypothesis top -->
  <rect class="n1" x="260" y="76" width="200" height="60" rx="8"/>
  <circle class="numbg" cx="284" cy="106" r="13"/><text class="num" x="284" y="111">1</text>
  <text class="t" x="304" y="102">Hypothesis</text>
  <text class="d" x="304" y="120">specific, testable</text>

  <!-- 2 data right -->
  <rect class="n2" x="500" y="180" width="196" height="60" rx="8"/>
  <circle class="numbg" cx="524" cy="210" r="13"/><text class="num" x="524" y="215">2</text>
  <text class="t" x="544" y="206">Data</text>
  <text class="d" x="544" y="224">do we have the logs</text>

  <!-- 3 hunt bottom right -->
  <rect class="n3" x="420" y="330" width="196" height="60" rx="8"/>
  <circle class="numbg" cx="444" cy="360" r="13"/><text class="num" x="444" y="365">3</text>
  <text class="t" x="464" y="356">Hunt</text>
  <text class="d" x="464" y="374">query and pivot</text>

  <!-- 4 finding bottom left -->
  <rect class="n4" x="104" y="330" width="196" height="60" rx="8"/>
  <circle class="numbg" cx="128" cy="360" r="13"/><text class="num" x="128" y="365">4</text>
  <text class="t" x="148" y="356">Finding</text>
  <text class="d" x="148" y="374">3 possible outcomes</text>

  <!-- 5 improve left -->
  <rect class="n5" x="24" y="180" width="196" height="60" rx="8"/>
  <circle class="numbg" cx="48" cy="210" r="13"/><text class="num" x="48" y="215">5</text>
  <text class="t" x="68" y="206">Improve</text>
  <text class="d" x="68" y="224">build a detection</text>

  <!-- arrows around the loop -->
  <path class="flow" d="M 460 106 C 560 120, 600 150, 598 178" fill="none"/>
  <path class="flow" d="M 560 240 C 560 290, 540 310, 516 328" fill="none"/>
  <path class="flow" d="M 420 360 L 302 360" fill="none"/>
  <path class="flow" d="M 150 328 C 120 300, 110 270, 118 242" fill="none"/>
  <path class="flow" d="M 122 180 C 150 120, 200 106, 258 106" fill="none"/>

  <text class="sub" x="250" y="240">A hunt you cannot turn</text>
  <text class="sub" x="250" y="258">into a detection is one</text>
  <text class="sub" x="250" y="276">you run by hand forever.</text>
  <text class="sub" x="250" y="294">Step five is what makes</text>
  <text class="sub" x="250" y="312">hunting sustainable.</text>

  <text class="sub" x="28" y="452">Outcomes at step four: compromise found, no compromise, or inconclusive. All three are valid. "No compromise" is the most common.</text>
</svg>
