<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-labelledby="t d">
  <title id="t">Defender XDR device timeline</title>
  <desc id="d">The Microsoft Defender XDR device timeline for the patient-zero workstation. A header shows the device name, risk level high, and exposure. A vertical process tree shows Excel spawning a scripting host, which spawns PowerShell, which accesses LSASS and makes a network connection. A right panel shows the automated investigation verdict and recommended actions. Numbered callouts point to the suspicious parent-child chain, the credential theft, and the isolate-device action.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .app { fill: #0f1117; stroke: #2b2f3a; stroke-width: 1.3; }
    .bar { fill: #1b1f2a; }
    .panel { fill: #171a22; stroke: #2b2f3a; stroke-width: 1.1; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .appt{ fill: #ffffff; font-size: 12px; font-weight: 700; }
    .lbl { fill: #9aa4b2; font-size: 10px; }
    .val { fill: #e6edf3; font-size: 11px; font-weight: 700; }
    .risk{ fill: #cf222e; }
    .riskt{ fill: #ffffff; font-size: 10px; font-weight: 700; text-anchor: middle; }
    .proc{ fill: #1f2733; stroke: #3b82f6; stroke-width: 1.3; }
    .procb{ fill: #2a1416; stroke: #ff7b72; stroke-width: 1.6; }
    .pn { fill: #e6edf3; font-size: 11px; font-weight: 700; }
    .pd { fill: #9aa4b2; font-size: 9.5px; }
    .tree{ stroke: #3b82f6; stroke-width: 1.6; fill: none; }
    .ok  { fill: #56d364; font-size: 10.5px; font-weight: 700; }
    .act { fill: #3b82f6; }
    .actt{ fill: #ffffff; font-size: 10px; font-weight: 700; text-anchor: middle; }
    .cnum{ fill: #0f1117; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .cc  { fill: #ffbd2e; stroke: #0f1117; stroke-width: 1.2; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } }
  </style>
  <text class="h1"  x="20" y="26">Defender XDR, device timeline</text>
  <text class="sub" x="20" y="44">What actually happened on the machine, process by process.</text>

  <rect class="app" x="20" y="58" width="820" height="400" rx="6"/>
  <rect class="bar" x="20" y="58" width="820" height="28" rx="6"/>
  <text class="appt" x="36" y="77">Defender XDR  &gt;  Devices  &gt;  WS-FIN01</text>

  <!-- header stats -->
  <text class="lbl" x="40" y="110">Device</text><text class="val" x="40" y="126">WS-FIN01</text>
  <text class="lbl" x="200" y="110">Risk level</text>
  <rect class="risk" x="200" y="114" width="56" height="18" rx="3"/><text class="riskt" x="228" y="127">HIGH</text>
  <text class="lbl" x="300" y="110">Exposure</text><text class="val" x="300" y="126">Elevated</text>
  <text class="lbl" x="440" y="110">First seen</text><text class="val" x="440" y="126">T plus 0</text>

  <!-- process tree -->
  <rect class="proc" x="44"  y="150" width="230" height="44" rx="5"/>
  <text class="pn" x="58" y="170">EXCEL.EXE</text><text class="pd" x="58" y="186">opened invoice.xlsm</text>
  <rect class="proc" x="78"  y="208" width="230" height="44" rx="5"/>
  <text class="pn" x="92" y="228">wscript.exe</text><text class="pd" x="92" y="244">macro spawned script host</text>
  <rect class="procb" x="112" y="266" width="230" height="44" rx="5"/>
  <text class="pn" x="126" y="286">powershell.exe</text><text class="pd" x="126" y="302">-enc, hidden window</text>
  <rect class="procb" x="146" y="324" width="230" height="44" rx="5"/>
  <text class="pn" x="160" y="344">lsass.exe access</text><text class="pd" x="160" y="360">credential dump attempt</text>
  <rect class="proc" x="146" y="382" width="230" height="40" rx="5"/>
  <text class="pn" x="160" y="402">net connection</text><text class="pd" x="160" y="416">to 185.x.x.x, C2</text>

  <path class="tree" d="M 60 194 L 60 230 L 76 230"/>
  <path class="tree" d="M 94 252 L 94 288 L 110 288"/>
  <path class="tree" d="M 128 310 L 128 346 L 144 346"/>
  <path class="tree" d="M 162 368 L 162 402 L 144 402"/>

  <!-- right panel: automated investigation -->
  <rect class="panel" x="560" y="150" width="260" height="272" rx="5"/>
  <text class="val" x="576" y="174">Automated investigation</text>
  <text class="ok"  x="576" y="198">Verdict: Malicious</text>
  <text class="lbl" x="576" y="222">Evidence</text>
  <text class="pd"  x="576" y="240">Macro to script to PowerShell</text>
  <text class="pd"  x="576" y="256">LSASS access from Office child</text>
  <text class="pd"  x="576" y="272">Outbound to known-bad IP</text>
  <text class="lbl" x="576" y="300">Recommended actions</text>
  <rect class="act" x="576" y="312" width="170" height="26" rx="4"/><text class="actt" x="661" y="329">Isolate device</text>
  <rect class="act" x="576" y="346" width="170" height="26" rx="4"/><text class="actt" x="661" y="363">Collect investigation pkg</text>
  <text class="pd"  x="576" y="392">Both require analyst</text>
  <text class="pd"  x="576" y="408">approval before running</text>

  <!-- callouts -->
  <circle class="cc" cx="300" cy="172" r="11"/><text class="cnum" x="300" y="176">1</text>
  <circle class="cc" cx="366" cy="346" r="11"/><text class="cnum" x="366" y="350">2</text>
  <circle class="cc" cx="760" cy="325" r="11"/><text class="cnum" x="760" y="329">3</text>

  <text class="foot" x="20" y="484">1 Office spawning a script host is the tell  2 the credential theft from memory  3 containment, one approval away.</text>
</svg>
