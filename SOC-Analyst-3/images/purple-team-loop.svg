<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="t d">
  <title id="t">The purple team loop, emulate, measure, improve</title>
  <desc id="d">A cycle of four stages. Plan, pick the threat actor and the techniques to emulate. Emulate, the red side runs the attack in a controlled way. Measure, the blue side records what was detected and what was missed. Improve, close the gaps and update detections. The arrow returns to plan. The centre says the goal is to find blind spots on purpose, before a real attacker finds them for you.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11.5px; }
    .plan { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.5; }
    .emu  { fill: #ffe0de; stroke: #cf222e; stroke-width: 1.5; }
    .meas { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
    .imp  { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.5; }
    .nm { fill: #1f2328; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .d  { fill: #424a53; font-size: 10px; text-anchor: middle; }
    .arc{ stroke: #8c959f; stroke-width: 2.2; fill: none; marker-end: url(#a); }
    .arrow{ fill: #8c959f; }
    .mid{ fill: #1f2328; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .mids{ fill: #656d76; font-size: 10.5px; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; }
      .plan { fill: #0c2d6b; stroke: #58a6ff; } .emu { fill: #3d1417; stroke: #f85149; }
      .meas { fill: #4a3808; stroke: #d29922; } .imp { fill: #0f2f17; stroke: #3fb950; }
      .nm { fill: #e6edf3; } .d { fill: #b1bac4; } .arc { stroke: #6e7681; } .arrow { fill: #6e7681; }
      .mid { fill: #e6edf3; } .mids { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker>
  </defs>
  <text class="h1"  x="24" y="30">The purple team loop</text>
  <text class="sub" x="24" y="49">Attack yourself on purpose, measure what you saw, close the gap, repeat.</text>

  <!-- four nodes around a centre -->
  <rect class="plan" x="330" y="80" width="160" height="70" rx="10"/>
  <text class="nm" x="410" y="110">1  Plan</text>
  <text class="d"  x="410" y="128">Pick the actor and</text>
  <text class="d"  x="410" y="142">the techniques</text>

  <rect class="emu" x="590" y="178" width="160" height="70" rx="10"/>
  <text class="nm" x="670" y="208">2  Emulate</text>
  <text class="d"  x="670" y="226">Red runs the</text>
  <text class="d"  x="670" y="240">attack, controlled</text>

  <rect class="meas" x="330" y="276" width="160" height="70" rx="10"/>
  <text class="nm" x="410" y="306">3  Measure</text>
  <text class="d"  x="410" y="324">Blue records seen</text>
  <text class="d"  x="410" y="338">and missed</text>

  <rect class="imp" x="70" y="178" width="160" height="70" rx="10"/>
  <text class="nm" x="150" y="208">4  Improve</text>
  <text class="d"  x="150" y="226">Close gaps, ship</text>
  <text class="d"  x="150" y="240">new detections</text>

  <!-- centre -->
  <text class="mid"  x="410" y="206">Find blind spots</text>
  <text class="mid"  x="410" y="224">on purpose</text>
  <text class="mids" x="410" y="244">before a real</text>
  <text class="mids" x="410" y="258">attacker does</text>

  <!-- arcs clockwise -->
  <path class="arc" d="M 490 120 C 580 130, 630 150, 660 176"/>
  <path class="arc" d="M 650 248 C 600 300, 520 318, 492 316"/>
  <path class="arc" d="M 330 316 C 240 318, 190 290, 168 250"/>
  <path class="arc" d="M 158 178 C 190 120, 260 100, 328 108"/>

  <text class="sub" x="24" y="384">Nine of sixteen techniques detected before the last exercise, sixteen of sixteen after. The seven it found were the whole point.</text>
</svg>
