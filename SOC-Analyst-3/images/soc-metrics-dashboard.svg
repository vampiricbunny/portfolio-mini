<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d">
  <title id="t">The SOC leadership metrics dashboard</title>
  <desc id="d">A leadership dashboard. A row of large stat tiles shows mean time to detect, mean time to respond, detection coverage, and the ratio of alerts to real incidents, each with an up or down arrow showing the trend. Below, a bar chart of incidents by severity this quarter and a small panel of the top detections by volume. The design is glanceable and aimed at a non-technical executive.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .app { fill: #0d1117; stroke: #30363d; stroke-width: 1.3; }
    .bar { fill: #161b22; }
    .tile{ fill: #161b22; stroke: #30363d; stroke-width: 1.1; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .appt{ fill: #e6edf3; font-size: 12px; font-weight: 700; }
    .tl { fill: #8b949e; font-size: 10.5px; }
    .big{ fill: #e6edf3; font-size: 30px; font-weight: 700; }
    .good{ fill: #3fb950; font-size: 11px; font-weight: 700; }
    .unit{ fill: #8b949e; font-size: 11px; }
    .cap{ fill: #8b949e; font-size: 10.5px; font-weight: 700; }
    .b1 { fill: #cf222e; } .b2 { fill: #e16f24; } .b3 { fill: #d4a72c; } .b4 { fill: #58a6ff; }
    .bl { fill: #8b949e; font-size: 9.5px; text-anchor: middle; }
    .dv { fill: #e6edf3; font-size: 10px; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } }
  </style>
  <text class="h1"  x="20" y="26">SOC leadership dashboard</text>
  <text class="sub" x="20" y="44">The work, translated into numbers a board can act on.</text>

  <rect class="app" x="20" y="58" width="820" height="384" rx="6"/>
  <rect class="bar" x="20" y="58" width="820" height="28" rx="6"/>
  <text class="appt" x="36" y="77">SOC metrics  &gt;  this quarter</text>

  <!-- stat tiles row -->
  <rect class="tile" x="36"  y="100" width="188" height="110" rx="6"/>
  <text class="tl"  x="52" y="124">Mean time to detect</text>
  <text class="big" x="52" y="166">6<tspan class="unit"> min</tspan></text>
  <text class="good" x="52" y="192">down 40 percent</text>

  <rect class="tile" x="236" y="100" width="188" height="110" rx="6"/>
  <text class="tl"  x="252" y="124">Mean time to respond</text>
  <text class="big" x="252" y="166">38<tspan class="unit"> min</tspan></text>
  <text class="good" x="252" y="192">down 35 percent</text>

  <rect class="tile" x="436" y="100" width="188" height="110" rx="6"/>
  <text class="tl"  x="452" y="124">Detection coverage</text>
  <text class="big" x="452" y="166">100<tspan class="unit"> pct</tspan></text>
  <text class="good" x="452" y="192">up from 56 percent</text>

  <rect class="tile" x="636" y="100" width="188" height="110" rx="6"/>
  <text class="tl"  x="652" y="124">Alerts per real incident</text>
  <text class="big" x="652" y="166">7<tspan class="unit"> to 1</tspan></text>
  <text class="good" x="652" y="192">down from 22 to 1</text>

  <!-- bar chart: incidents by severity -->
  <rect class="tile" x="36" y="228" width="380" height="192" rx="6"/>
  <text class="cap" x="52" y="252">Incidents by severity, this quarter</text>
  <!-- bars baseline y=392 -->
  <rect class="b4" x="80"  y="300" width="56" height="92"/><text class="bl" x="108" y="406">Low 14</text>
  <rect class="b3" x="170" y="320" width="56" height="72"/><text class="bl" x="198" y="406">Med 9</text>
  <rect class="b2" x="260" y="352" width="56" height="40"/><text class="bl" x="288" y="406">High 4</text>
  <rect class="b1" x="350" y="376" width="56" height="16"/><text class="bl" x="378" y="406">Sev1 1</text>

  <!-- top detections panel -->
  <rect class="tile" x="428" y="228" width="396" height="192" rx="6"/>
  <text class="cap" x="444" y="252">Top detections by volume</text>
  <text class="dv" x="444" y="280">Suspicious PowerShell</text><text class="dv" x="760" y="280" text-anchor="end">312</text>
  <text class="dv" x="444" y="304">Office spawning scripts</text><text class="dv" x="760" y="304" text-anchor="end">188</text>
  <text class="dv" x="444" y="328">LSASS access</text><text class="dv" x="760" y="328" text-anchor="end">94</text>
  <text class="dv" x="444" y="352">New-domain beaconing</text><text class="dv" x="760" y="352" text-anchor="end">61</text>
  <text class="dv" x="444" y="376">Kerberoasting</text><text class="dv" x="760" y="376" text-anchor="end">23</text>
  <text class="sub" x="444" y="402" font-size="9.5">Volume is not value. These are reviewed for tuning each week.</text>

  <text class="foot" x="20" y="458"> The headline is the trend, not any single number.</text>
</svg>
