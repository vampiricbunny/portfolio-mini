<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d">
  <title id="t">The OpenCTI threat intelligence platform</title>
  <desc id="d">The OpenCTI threat intelligence platform. A left navigation lists threats, arsenal, entities and observations. The centre shows a threat actor knowledge graph: the actor linked to the loader malware, the techniques it uses, and the indicators seen. A right panel shows the actor overview and the detection priorities this intel drives.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .app { fill: #0e1b24; stroke: #163142; stroke-width: 1.3; }
    .bar { fill: #0a2f3a; }
    .nav { fill: #0c2430; }
    .panel { fill: #122a36; stroke: #1d4152; stroke-width: 1.1; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .appt{ fill: #ffffff; font-size: 12px; font-weight: 700; }
    .navi{ fill: #cfe3ec; font-size: 10.5px; }
    .navs{ fill: #00b8a9; font-size: 10.5px; font-weight: 700; }
    .nActor{ fill: #cf222e; stroke: #ffa198; stroke-width: 1.6; }
    .nMal { fill: #9a6700; stroke: #e3b341; stroke-width: 1.4; }
    .nTech{ fill: #0a6ed1; stroke: #58a6ff; stroke-width: 1.4; }
    .nInd { fill: #1a7f37; stroke: #56d364; stroke-width: 1.4; }
    .nl { fill: #ffffff; font-size: 9px; font-weight: 700; text-anchor: middle; }
    .edge{ stroke: #2f5d70; stroke-width: 1.6; fill: none; }
    .el { fill: #8fb3c2; font-size: 8.5px; }
    .lbl{ fill: #8fb3c2; font-size: 10px; }
    .val{ fill: #e6edf3; font-size: 10.5px; font-weight: 600; }
    .pri{ fill: #ffd37a; font-size: 10px; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } }
  </style>
  <text class="h1"  x="20" y="26">OpenCTI, intelligence that drives detection</text>
  <text class="sub" x="20" y="44">Turning actor reporting into what the team detects next.</text>

  <rect class="app" x="20" y="58" width="820" height="372" rx="6"/>
  <rect class="bar" x="20" y="58" width="820" height="28" rx="6"/>
  <text class="appt" x="36" y="77">OpenCTI  &gt;  Threats  &gt;  Actor profile</text>

  <!-- nav -->
  <rect class="nav" x="20" y="86" width="150" height="344"/>
  <text class="navs" x="36" y="116">Threats</text>
  <text class="navi" x="36" y="140">Arsenal</text>
  <text class="navi" x="36" y="164">Entities</text>
  <text class="navi" x="36" y="188">Observations</text>
  <text class="navi" x="36" y="212">Indicators</text>
  <text class="navi" x="36" y="236">Reports</text>
  <text class="navi" x="36" y="260">Feeds</text>

  <!-- centre graph -->
  <circle class="nActor" cx="340" cy="200" r="34"/><text class="nl" x="340" y="197">Actor</text><text class="nl" x="340" y="209" font-size="8">loader crew</text>
  <circle class="nMal" cx="340" cy="320" r="28"/><text class="nl" x="340" y="318">Loader</text><text class="nl" x="340" y="330" font-size="8">malware</text>
  <circle class="nTech" cx="480" cy="140" r="26"/><text class="nl" x="480" y="138">T1566</text><text class="nl" x="480" y="150" font-size="8">phishing</text>
  <circle class="nTech" cx="520" cy="230" r="26"/><text class="nl" x="520" y="228">T1003</text><text class="nl" x="520" y="240" font-size="8">LSASS</text>
  <circle class="nInd" cx="470" cy="330" r="26"/><text class="nl" x="470" y="328">IOCs</text><text class="nl" x="470" y="340" font-size="8">from case</text>

  <path class="edge" d="M 372 184 L 456 150"/><text class="el" x="398" y="158">uses</text>
  <path class="edge" d="M 374 210 L 494 226"/><text class="el" x="408" y="210">uses</text>
  <path class="edge" d="M 340 234 L 340 292"/><text class="el" x="346" y="266">deploys</text>
  <path class="edge" d="M 366 314 L 446 328"/><text class="el" x="388" y="314">drops</text>

  <!-- right panel -->
  <rect class="panel" x="580" y="98" width="244" height="316" rx="5"/>
  <text class="val" x="596" y="122" fill="#ffffff" font-weight="700">Actor overview</text>
  <text class="lbl" x="596" y="146">Motivation</text><text class="val" x="596" y="162">Financial, ransomware</text>
  <text class="lbl" x="596" y="186">Targets</text><text class="val" x="596" y="202">Small retail and finance</text>
  <text class="lbl" x="596" y="226">Relevance here</text><text class="val" x="596" y="242">High, matches our lab</text>
  <text class="val" x="596" y="276" fill="#ffffff" font-weight="700">Detection priorities</text>
  <text class="pri" x="596" y="298">1  Office spawning scripts</text>
  <text class="pri" x="596" y="316">2  LSASS access patterns</text>
  <text class="pri" x="596" y="334">3  Beaconing to new domains</text>
  <text class="pri" x="596" y="352">4  Startup-folder persistence</text>
  <text class="lbl" x="596" y="384">These become the</text>
  <text class="lbl" x="596" y="400">detection backlog</text>

  <text class="foot" x="20" y="456"> Intel is only useful when it changes what you detect, which is what the right panel does.</text>
</svg>
