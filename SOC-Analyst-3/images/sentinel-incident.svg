<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="t d">
  <title id="t">Microsoft Sentinel incident investigation graph</title>
  <desc id="d">The Microsoft Sentinel incident page. A left panel shows the incident title, high severity, status active, and the entities and tactics. The centre is the investigation graph, where the incident node connects to the patient-zero workstation, the finance user, a malicious file, a command-and-control IP, and a second workstation reached by lateral movement. A bottom strip shows the alert timeline. Numbered callouts point to the severity, the lateral movement edge, and the command-and-control connection.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .app { fill: #0b1b2b; stroke: #0a2540; stroke-width: 1.3; }
    .bar { fill: #0a2540; }
    .panel { fill: #10263f; stroke: #1c3a5e; stroke-width: 1.1; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .appt{ fill: #ffffff; font-size: 12px; font-weight: 700; }
    .lbl { fill: #9fb3c8; font-size: 10px; }
    .val { fill: #e6edf3; font-size: 11px; font-weight: 700; }
    .sev { fill: #cf222e; }
    .sevt{ fill: #ffffff; font-size: 10px; font-weight: 700; text-anchor: middle; }
    .edge{ stroke: #3d5a80; stroke-width: 1.8; fill: none; }
    .edgeh{ stroke: #ff7b72; stroke-width: 2.3; fill: none; }
    .nInc { fill: #cf222e; stroke: #ffa198; stroke-width: 1.6; }
    .nHost{ fill: #0a6ed1; stroke: #58a6ff; stroke-width: 1.4; }
    .nUser{ fill: #8250df; stroke: #c297ff; stroke-width: 1.4; }
    .nFile{ fill: #9a6700; stroke: #e3b341; stroke-width: 1.4; }
    .nIp  { fill: #1a7f37; stroke: #56d364; stroke-width: 1.4; }
    .nl { fill: #ffffff; font-size: 9.5px; font-weight: 700; text-anchor: middle; }
    .el { fill: #9fb3c8; font-size: 9px; }
    .elh{ fill: #ff9d96; font-size: 9px; font-weight: 700; }
    .tl { fill: #9fb3c8; font-size: 9.5px; }
    .tlb{ fill: #58a6ff; }
    .cnum{ fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .cc  { fill: #ffbd2e; stroke: #0b1b2b; stroke-width: 1.2; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } }
  </style>
  <text class="h1"  x="20" y="26">Microsoft Sentinel, incident investigation</text>
  <text class="sub" x="20" y="44">Reading a whole intrusion at once: entities, connections and blast radius.</text>

  <rect class="app" x="20" y="58" width="820" height="414" rx="6"/>
  <rect class="bar" x="20" y="58" width="820" height="28" rx="6"/>
  <text class="appt" x="36" y="77">Sentinel  &gt;  Incidents  &gt;  INC-2041</text>

  <!-- left detail panel -->
  <rect class="panel" x="34" y="98" width="214" height="360" rx="5"/>
  <text class="val" x="48" y="122">Suspected hands-on-keyboard</text>
  <text class="val" x="48" y="138">intrusion, WS-FIN01</text>
  <rect class="sev" x="48" y="150" width="60" height="18" rx="3"/><text class="sevt" x="78" y="163">HIGH</text>
  <text class="lbl" x="118" y="163">Active</text>
  <text class="lbl" x="48" y="192">Owner</text><text class="val" x="48" y="208">vbunny (IC)</text>
  <text class="lbl" x="48" y="232">Entities</text>
  <text class="val" x="48" y="250">2 hosts, 1 user,</text>
  <text class="val" x="48" y="266">1 file, 1 IP</text>
  <text class="lbl" x="48" y="292">Tactics</text>
  <text class="val" x="48" y="310">Initial Access</text>
  <text class="val" x="48" y="326">Credential Access</text>
  <text class="val" x="48" y="342">Lateral Movement</text>
  <text class="lbl" x="48" y="368">Alerts in incident</text>
  <text class="val" x="48" y="386">5, correlated</text>
  <text class="lbl" x="48" y="412">MITRE</text>
  <text class="val" x="48" y="430">T1566, T1003,</text>
  <text class="val" x="48" y="446">T1021</text>

  <!-- investigation graph -->
  <!-- incident node centre -->
  <circle class="nInc" cx="470" cy="200" r="30"/><text class="nl" x="470" y="197">INC</text><text class="nl" x="470" y="209" font-size="8">2041</text>
  <!-- file -->
  <circle class="nFile" cx="360" cy="140" r="26"/><text class="nl" x="360" y="138">invoice</text><text class="nl" x="360" y="150" font-size="8">.xlsm</text>
  <!-- user -->
  <circle class="nUser" cx="360" cy="270" r="26"/><text class="nl" x="360" y="268">finance</text><text class="nl" x="360" y="280" font-size="8">user</text>
  <!-- patient zero host -->
  <circle class="nHost" cx="600" cy="150" r="28"/><text class="nl" x="600" y="148">WS-FIN01</text><text class="nl" x="600" y="160" font-size="8">patient zero</text>
  <!-- C2 ip -->
  <circle class="nIp" cx="720" cy="230" r="26"/><text class="nl" x="720" y="228">C2 IP</text><text class="nl" x="720" y="240" font-size="8">185.x.x.x</text>
  <!-- second host -->
  <circle class="nHost" cx="600" cy="300" r="28"/><text class="nl" x="600" y="298">WS-IT01</text><text class="nl" x="600" y="310" font-size="8">2nd host</text>

  <path class="edge" d="M 383 152 L 446 188"/>
  <path class="edge" d="M 383 258 L 446 213"/>
  <path class="edge" d="M 498 188 L 574 160"/>
  <path class="edge" d="M 626 160 L 697 218"/><text class="elh" x="648" y="180">C2 beacon</text>
  <path class="edgeh" d="M 600 178 L 600 272"/><text class="elh" x="606" y="228">lateral move</text>

  <!-- timeline strip -->
  <rect class="panel" x="266" y="408" width="560" height="44" rx="5"/>
  <text class="tl" x="280" y="426">Alert timeline</text>
  <circle class="tlb" cx="300" cy="440" r="4"/><text class="tl" x="312" y="444">macro</text>
  <circle class="tlb" cx="420" cy="440" r="4"/><text class="tl" x="432" y="444">LSASS access</text>
  <circle cx="580" cy="440" r="4" fill="#ff7b72"/><text class="tl" x="592" y="444">lateral move, alert fired</text>
  <circle class="tlb" cx="760" cy="440" r="4"/><text class="tl" x="772" y="444">contained</text>

  <!-- callouts -->
  <circle class="cc" cx="226" cy="159" r="11"/><text class="cnum" x="226" y="163">1</text>
  <circle class="cc" cx="600" cy="225" r="11"/><text class="cnum" x="600" y="229">2</text>
  <circle class="cc" cx="680" cy="195" r="11"/><text class="cnum" x="680" y="199">3</text>

  <text class="foot" x="20" y="498">1 high severity, auto-correlated from 5 alerts  2 the lateral movement edge, where it was caught  3 the C2 connection.</text>
</svg>
