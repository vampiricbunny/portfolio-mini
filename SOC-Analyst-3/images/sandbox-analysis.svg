<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" role="img" aria-labelledby="t d">
  <title id="t">Malware sandbox detonation report</title>
  <desc id="d">A malware sandbox report for the attachment. A verdict banner reads malicious with a high score. A left panel shows file details and the detection engines that flagged it. A behaviour panel lists the observed actions: spawns PowerShell, reads LSASS, beacons to a command-and-control address. A right panel lists the extracted indicators, a hash, a domain and an IP, with a note that these were fed back into the intel platform.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .app { fill: #11161d; stroke: #2b333f; stroke-width: 1.3; }
    .bar { fill: #1a212b; }
    .panel { fill: #18202a; stroke: #2b333f; stroke-width: 1.1; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .appt{ fill: #ffffff; font-size: 12px; font-weight: 700; }
    .mal { fill: #cf222e; }
    .malt{ fill: #ffffff; font-size: 13px; font-weight: 700; }
    .lbl { fill: #9aa4b2; font-size: 10px; }
    .val { fill: #e6edf3; font-size: 10.5px; }
    .bad { fill: #ff7b72; font-size: 10.5px; font-weight: 700; }
    .ok  { fill: #56d364; font-size: 10.5px; }
    .ioc { fill: #ffd37a; font-size: 10px; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } }
  </style>
  <text class="h1"  x="20" y="26">Sandbox detonation of the attachment</text>
  <text class="sub" x="20" y="44">First-pass triage: detonate safely, read the behaviour, pull the indicators.</text>

  <rect class="app" x="20" y="58" width="820" height="380" rx="6"/>
  <rect class="bar" x="20" y="58" width="820" height="28" rx="6"/>
  <text class="appt" x="36" y="77">Sandbox report  &gt;  invoice.xlsm</text>

  <!-- verdict banner -->
  <rect class="mal" x="36" y="100" width="788" height="40" rx="5"/>
  <text class="malt" x="52" y="125">Verdict: MALICIOUS    Score 92 of 100    Loader family, known</text>

  <!-- left: file + engines -->
  <rect class="panel" x="36" y="154" width="250" height="268" rx="5"/>
  <text class="val" x="52" y="178" font-weight="700" fill="#ffffff">File details</text>
  <text class="lbl" x="52" y="200">Name</text><text class="val" x="120" y="200">invoice.xlsm</text>
  <text class="lbl" x="52" y="220">Type</text><text class="val" x="120" y="220">Excel, macro</text>
  <text class="lbl" x="52" y="240">Size</text><text class="val" x="120" y="240">84 KB</text>
  <text class="val" x="52" y="272" font-weight="700" fill="#ffffff">Detection engines</text>
  <text class="bad" x="52" y="294">54 of 70 flagged malicious</text>
  <text class="val" x="52" y="314">Trojan.Downloader</text>
  <text class="val" x="52" y="332">VBA/Agent</text>
  <text class="val" x="52" y="350">Macro.Dropper</text>
  <text class="lbl" x="52" y="384">Submitted</text><text class="val" x="52" y="402">during INC-2041</text>

  <!-- centre: behaviour -->
  <rect class="panel" x="298" y="154" width="268" height="268" rx="5"/>
  <text class="val" x="314" y="178" font-weight="700" fill="#ffffff">Observed behaviour</text>
  <text class="bad" x="314" y="204">Spawns powershell.exe hidden</text>
  <text class="bad" x="314" y="226">Reads lsass.exe memory</text>
  <text class="bad" x="314" y="248">Beacons to C2 every 60s</text>
  <text class="val" x="314" y="270">Writes to user startup folder</text>
  <text class="val" x="314" y="292">Queries domain membership</text>
  <text class="val" x="314" y="314">Disables Office macro warning</text>
  <text class="lbl" x="314" y="346">Maps to ATT&amp;CK</text>
  <text class="val" x="314" y="366">T1566 Phishing</text>
  <text class="val" x="314" y="384">T1059 PowerShell</text>
  <text class="val" x="314" y="402">T1003 LSASS</text>

  <!-- right: IOCs -->
  <rect class="panel" x="578" y="154" width="246" height="268" rx="5"/>
  <text class="val" x="594" y="178" font-weight="700" fill="#ffffff">Extracted indicators</text>
  <text class="lbl" x="594" y="202">SHA256</text>
  <text class="mono ioc" x="594" y="220" font-size="9">a1b2c3d4e5f6...9f8e</text>
  <text class="lbl" x="594" y="246">C2 domain</text>
  <text class="mono ioc" x="594" y="264" font-size="9.5">update-cdn.badhost</text>
  <text class="lbl" x="594" y="290">C2 IP</text>
  <text class="mono ioc" x="594" y="308" font-size="9.5">185.x.x.x</text>
  <text class="ok" x="594" y="346">Fed into OpenCTI,</text>
  <text class="ok" x="594" y="364">turned into a detection</text>
  <text class="val" x="594" y="396">Incident to intel to</text>
  <text class="val" x="594" y="414">new rule, the SOC loop</text>

  <text class="foot" x="20" y="464"> Deep reverse engineering is escalated. This first pass answers the response in minutes.</text>
</svg>
