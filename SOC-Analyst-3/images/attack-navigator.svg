<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d">
  <title id="t">MITRE ATT&amp;CK Navigator coverage heatmap, schematic</title>
  <desc id="d">A drawn representation of the MITRE ATT&amp;CK Navigator. Columns are tactics: Initial Access, Execution, Credential Access, Lateral Movement, Exfiltration. Each column holds technique cells coloured by detection coverage. Green means detected, amber means partial, red means blind. After the purple team exercise almost every cell is green, with a dotted outline marking the seven cells that were red before. A legend explains the colours. A footer states this is a schematic illustration and not a screen capture.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .app { fill: #1e1e1e; stroke: #000000; stroke-width: 1.2; }
    .bar { fill: #2d2d2d; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .appt{ fill: #ffffff; font-size: 12px; font-weight: 700; }
    .colh{ fill: #3c3c3c; stroke: #555; stroke-width: 1; }
    .colt{ fill: #ffffff; font-size: 10px; font-weight: 700; text-anchor: middle; }
    .green{ fill: #2e7d32; stroke: #1b5e20; stroke-width: 0.8; }
    .amber{ fill: #c9a227; stroke: #8a6d00; stroke-width: 0.8; }
    .red  { fill: #b23030; stroke: #7a1f1f; stroke-width: 0.8; }
    .cell{ fill: #e8e8e8; font-size: 8.5px; text-anchor: middle; }
    .wasred{ fill: none; stroke: #ffffff; stroke-width: 1.4; stroke-dasharray: 3 2; }
    .lg { fill: #1f2328; font-size: 10.5px; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } .lg { fill: #c9d1d9; } }
  </style>
  <text class="h1"  x="20" y="26">ATT&amp;CK Navigator, coverage after the purple team</text>
  <text class="sub" x="20" y="44">Green is seen, red is blind. The dotted cells were red before the exercise.</text>

  <rect class="app" x="20" y="58" width="820" height="320" rx="5"/>
  <rect class="bar" x="20" y="58" width="820" height="26" rx="5"/>
  <text class="appt" x="36" y="76">ATT&amp;CK Navigator  &gt;  vbunnylab coverage layer</text>

  <!-- 5 columns -->
  <!-- column x positions -->
  <!-- IA 40, EX 200, CA 360, LM 520, EXF 680 ; width 140 -->
  <g>
    <rect class="colh" x="40"  y="98" width="140" height="24"/><text class="colt" x="110" y="114">Initial Access</text>
    <rect class="colh" x="200" y="98" width="140" height="24"/><text class="colt" x="270" y="114">Execution</text>
    <rect class="colh" x="360" y="98" width="140" height="24"/><text class="colt" x="430" y="114">Credential Access</text>
    <rect class="colh" x="520" y="98" width="140" height="24"/><text class="colt" x="590" y="114">Lateral Movement</text>
    <rect class="colh" x="680" y="98" width="140" height="24"/><text class="colt" x="750" y="114">Exfiltration</text>
  </g>

  <!-- Initial Access: 3 cells, all green, 1 was red -->
  <rect class="green" x="40"  y="128" width="140" height="30"/><text class="cell" x="110" y="147">Phishing</text>
  <rect class="green" x="40"  y="162" width="140" height="30"/><text class="cell" x="110" y="181">Valid Accounts</text>
  <rect class="green" x="40"  y="196" width="140" height="30"/><text class="cell" x="110" y="215">Ext Remote Svc</text>
  <rect class="wasred" x="40" y="196" width="140" height="30"/>

  <!-- Execution: 4 cells green, 1 was red -->
  <rect class="green" x="200" y="128" width="140" height="30"/><text class="cell" x="270" y="147">Cmd and Script</text>
  <rect class="green" x="200" y="162" width="140" height="30"/><text class="cell" x="270" y="181">PowerShell</text>
  <rect class="green" x="200" y="196" width="140" height="30"/><text class="cell" x="270" y="215">WMI</text>
  <rect class="green" x="200" y="230" width="140" height="30"/><text class="cell" x="270" y="249">Scheduled Task</text>
  <rect class="wasred" x="200" y="230" width="140" height="30"/>

  <!-- Credential Access: 3 cells green, 2 were red -->
  <rect class="green" x="360" y="128" width="140" height="30"/><text class="cell" x="430" y="147">LSASS Memory</text>
  <rect class="green" x="360" y="162" width="140" height="30"/><text class="cell" x="430" y="181">DCSync</text>
  <rect class="wasred" x="360" y="162" width="140" height="30"/>
  <rect class="green" x="360" y="196" width="140" height="30"/><text class="cell" x="430" y="215">Kerberoasting</text>
  <rect class="wasred" x="360" y="196" width="140" height="30"/>

  <!-- Lateral Movement: 4 cells green, 1 was red -->
  <rect class="green" x="520" y="128" width="140" height="30"/><text class="cell" x="590" y="147">Remote Services</text>
  <rect class="green" x="520" y="162" width="140" height="30"/><text class="cell" x="590" y="181">Pass the Hash</text>
  <rect class="green" x="520" y="196" width="140" height="30"/><text class="cell" x="590" y="215">RDP</text>
  <rect class="green" x="520" y="230" width="140" height="30"/><text class="cell" x="590" y="249">Admin Shares</text>
  <rect class="wasred" x="520" y="230" width="140" height="30"/>

  <!-- Exfiltration: 2 cells green, both were red -->
  <rect class="green" x="680" y="128" width="140" height="30"/><text class="cell" x="750" y="147">Over C2</text>
  <rect class="wasred" x="680" y="128" width="140" height="30"/>
  <rect class="green" x="680" y="162" width="140" height="30"/><text class="cell" x="750" y="181">Web Service</text>
  <rect class="wasred" x="680" y="162" width="140" height="30"/>

  <!-- legend -->
  <rect class="green" x="40" y="398" width="18" height="14"/><text class="lg" x="64" y="410">detected</text>
  <rect class="amber" x="150" y="398" width="18" height="14"/><text class="lg" x="174" y="410">partial</text>
  <rect class="red"   x="250" y="398" width="18" height="14"/><text class="lg" x="274" y="410">blind</text>
  <rect class="wasred" x="350" y="398" width="18" height="14"/><text class="lg" x="374" y="410">was blind before the purple team</text>

  <text class="foot" x="20" y="444">Sixteen of sixteen techniques covered after the exercise, up from nine. The seven dotted cells are the blind spots it found and closed.</text>
  <text class="foot" x="20" y="462">Schematic illustration of the ATT&amp;CK Navigator, not a screen capture.</text>
</svg>
