<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="t d">
  <title id="t">BloodHound attack path</title>
  <desc id="d">A BloodHound graph on a dark canvas. Starting from the low-privileged domain user reached through the pivot, two paths lead to Domain Admin. Path A runs through the Kerberoastable service account. Path B runs through the certificate authority, where a vulnerable template allows enrolment as any identity. Nodes are joined by labelled edges such as MemberOf, HasSPN and Enroll. Numbered callouts mark the start node, the two paths, and the Domain Admin target.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .canvas { fill: #12161c; stroke: #30363d; stroke-width: 1.3; }
    .edge { stroke: #4d5866; stroke-width: 2; fill: none; marker-end: url(#e); }
    .edgeh{ stroke: #cf222e; stroke-width: 2.4; fill: none; marker-end: url(#eh); }
    .em { fill: #4d5866; } .emh { fill: #cf222e; }
    .nuser { fill: #1f6feb; stroke: #79c0ff; stroke-width: 1.5; }
    .ngroup{ fill: #d29922; stroke: #f2cc60; stroke-width: 1.5; }
    .ncomp { fill: #3fb950; stroke: #7ee787; stroke-width: 1.5; }
    .nda   { fill: #cf222e; stroke: #ffa198; stroke-width: 1.8; }
    .nl { fill: #ffffff; font-size: 10px; font-weight: 700; text-anchor: middle; }
    .el { fill: #8b949e; font-size: 9.5px; font-weight: 700; }
    .elh{ fill: #ff7b72; font-size: 9.5px; font-weight: 700; }
    .cnum { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .cc   { fill: #cf222e; stroke: #ffffff; stroke-width: 1.2; }
    .clbl { fill: #a40e26; font-size: 10.5px; font-weight: 700; }
    .foot { fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } .clbl { fill: #ff7b72; }
    }
  </style>
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="em"/></marker>
    <marker id="eh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="emh"/></marker>
  </defs>
  <text class="h1"  x="20" y="26">BloodHound, the path to Domain Admin</text>
  <text class="sub" x="20" y="44">One low-privileged user, two mapped routes to the top of the domain.</text>

  <rect class="canvas" x="20" y="58" width="800" height="368" rx="7"/>

  <!-- start node -->
  <circle class="nuser" cx="110" cy="242" r="34"/>
  <text class="nl" x="110" y="239">jdoe</text>
  <text class="nl" x="110" y="252" font-size="8">low priv</text>

  <!-- path A: service account -->
  <circle class="ncomp" cx="360" cy="140" r="32"/>
  <text class="nl" x="360" y="138">svc_sql</text>
  <text class="nl" x="360" y="150" font-size="8">HasSPN</text>
  <circle class="ngroup" cx="600" cy="140" r="30"/>
  <text class="nl" x="600" y="138">Server</text>
  <text class="nl" x="600" y="150" font-size="8">Admins</text>

  <path class="edge" d="M 140 222 C 220 180, 280 160, 327 147"/>
  <text class="el" x="200" y="180">Kerberoast</text>
  <path class="edge" d="M 392 140 L 568 140"/>
  <text class="el" x="452" y="132">MemberOf</text>

  <!-- path B: ADCS -->
  <circle class="ncomp" cx="360" cy="342" r="32"/>
  <text class="nl" x="360" y="340">CA01</text>
  <text class="nl" x="360" y="352" font-size="8">cert auth</text>
  <path class="edgeh" d="M 140 262 C 220 300, 280 322, 327 335"/>
  <text class="elh" x="190" y="316">Enroll (ESC1)</text>

  <!-- domain admin target -->
  <circle class="nda" cx="720" cy="242" r="38"/>
  <text class="nl" x="720" y="239">DOMAIN</text>
  <text class="nl" x="720" y="253">ADMIN</text>

  <path class="edge" d="M 626 158 C 680 185, 700 200, 712 208"/>
  <path class="edgeh" d="M 392 342 C 560 342, 640 300, 700 272"/>
  <text class="elh" x="470" y="336">issue cert as DA</text>

  <!-- callouts -->
  <circle class="cc" cx="110" cy="196" r="12"/><text class="cnum" x="110" y="200">1</text>
  <circle class="cc" cx="360" cy="98" r="12"/><text class="cnum" x="360" y="102">2</text>
  <circle class="cc" cx="360" cy="392" r="12"/><text class="cnum" x="360" y="396">3</text>
  <circle class="cc" cx="720" cy="196" r="12"/><text class="cnum" x="720" y="200">4</text>

  <text class="foot" x="20" y="446">1 start, the pivoted user  2 path A, Kerberoasting  3 path B, ADCS ESC1, the one that won  4 target.</text>
</svg>
