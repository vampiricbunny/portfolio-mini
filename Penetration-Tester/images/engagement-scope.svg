<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="t d">
  <title id="t">What is in scope and what is out</title>
  <desc id="d">A scope diagram. In scope, on the left in green, are the perimeter range, the two internal ranges, the harbor.local domain and the customer web application. Out of scope, on the right in red, are the Proxmox host and management network, denial of service, and social engineering of real people. The starting position is black box externally and grey box for the web application. A note states that a written scope is what stops interesting from becoming out of bounds.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11.5px; }
    .inbox { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.5; }
    .outbox{ fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .startbox { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.5; }
    .lbl { fill: #1f2328; font-size: 13px; font-weight: 700; }
    .it  { fill: #1f2328; font-size: 11.5px; }
    .itg { fill: #1a7f37; font-size: 12px; }
    .itr { fill: #a40e26; font-size: 12px; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; }
      .inbox { fill: #0f2f17; stroke: #3fb950; } .outbox { fill: #3d1417; stroke: #f85149; }
      .startbox { fill: #0c2d6b; stroke: #58a6ff; }
      .lbl { fill: #e6edf3; } .it { fill: #e6edf3; }
      .itg { fill: #56d364; } .itr { fill: #ff7b72; }
    }
  </style>
  <text class="h1"  x="24" y="30">Engagement scope</text>
  <text class="sub" x="24" y="49">Agreed before anything is touched. The boundary is the job.</text>

  <rect class="inbox" x="24" y="66" width="378" height="196" rx="8"/>
  <text class="lbl" x="44" y="92">In scope</text>
  <text class="itg" x="44" y="120">Perimeter range 172.16.5.0/24</text>
  <text class="itg" x="44" y="146">Corporate range 10.70.10.0/24</text>
  <text class="itg" x="44" y="172">Server VLAN 10.70.20.0/24</text>
  <text class="itg" x="44" y="198">The harbor.local domain, all hosts</text>
  <text class="itg" x="44" y="224">The customer web application</text>
  <text class="itg" x="44" y="250">Exploitation, escalation, lateral movement</text>

  <rect class="outbox" x="418" y="66" width="378" height="196" rx="8"/>
  <text class="lbl" x="438" y="92">Out of scope</text>
  <text class="itr" x="438" y="120">The Proxmox host itself</text>
  <text class="itr" x="438" y="146">The hypervisor management network</text>
  <text class="itr" x="438" y="172">Denial of service of any kind</text>
  <text class="itr" x="438" y="198">Destructive or ransomware payloads</text>
  <text class="itr" x="438" y="224">Social engineering of real people</text>
  <text class="itr" x="438" y="250">Taking real data off site</text>

  <rect class="startbox" x="24" y="278" width="772" height="58" rx="8"/>
  <text class="lbl" x="44" y="304">Starting position</text>
  <text class="it"  x="44" y="326">Black box externally, a name and a range and no credentials. Grey box for the web app, one low-privileged account supplied.</text>

  <text class="foot" x="24" y="368">A written scope is what stops "interesting" from becoming "out of bounds" once a foothold makes every adjacent system tempting.</text>
</svg>
