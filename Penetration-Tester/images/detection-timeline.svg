<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-labelledby="t d">
  <title id="t">What each step of the attack looked like to a defender</title>
  <desc id="d">The nine attack steps down the left, each scored for whether a defender caught it. Green means caught live, amber means visible but not alerted, red means missed. Kerberoasting and lateral movement to the database were caught. The pivot and internal scan were visible in traffic but not alerted. External recon, LLMNR poisoning and the certificate abuse were missed, and DCSync was found only on a later hunt. A note says two of nine steps were caught live, and the worst gap was the certificate abuse that took the domain.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11.5px; }
    .row{ fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .green{ fill: #1a7f37; } .amber{ fill: #9a6700; } .red{ fill: #a40e26; }
    .st { fill: #1f2328; font-size: 11.5px; font-weight: 600; }
    .sd { fill: #57606a; font-size: 10px; }
    .badge{ fill: #ffffff; font-size: 9.5px; font-weight: 700; text-anchor: middle; }
    .key { fill: #57606a; font-size: 10.5px; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } .key { fill: #8b949e; }
      .row { fill: #161b22; stroke: #30363d; } .st { fill: #e6edf3; } .sd { fill: #8b949e; }
      .green{ fill: #238636; } .amber{ fill: #9e6a03; } .red{ fill: #b62324; }
    }
  </style>
  <text class="h1"  x="24" y="30">The attack, scored for visibility</text>
  <text class="sub" x="24" y="49">Two of nine steps caught live. The step that took the domain was the least visible.</text>

  <!-- rows -->
  <!-- each row: rect, status pill, text -->
  <g>
    <rect class="row" x="24" y="66"  width="792" height="34" rx="4"/>
    <rect class="red"   x="34" y="73" width="110" height="20" rx="4"/><text class="badge" x="89" y="87">MISSED</text>
    <text class="st" x="158" y="82">1  External recon, active scan</text>
    <text class="sd" x="158" y="95">Nothing was watching the perimeter</text>

    <rect class="row" x="24" y="104" width="792" height="34" rx="4"/>
    <rect class="amber" x="34" y="111" width="110" height="20" rx="4"/><text class="badge" x="89" y="125">IN LOGS</text>
    <text class="st" x="158" y="120">2  Web file upload to RCE</text>
    <text class="sd" x="158" y="133">In the web server logs, no rule fired. Findable on a hunt</text>

    <rect class="row" x="24" y="142" width="792" height="34" rx="4"/>
    <rect class="amber" x="34" y="149" width="110" height="20" rx="4"/><text class="badge" x="89" y="163">SEEN</text>
    <text class="st" x="158" y="158">3 and 4  Pivot and internal scan</text>
    <text class="sd" x="158" y="171">Anomalous in the NOC-02 flow data, not alerted on for security</text>

    <rect class="row" x="24" y="180" width="792" height="34" rx="4"/>
    <rect class="red"   x="34" y="187" width="110" height="20" rx="4"/><text class="badge" x="89" y="201">MISSED</text>
    <text class="st" x="158" y="196">5  LLMNR poisoning</text>
    <text class="sd" x="158" y="209">Catchable, but no detection was in place</text>

    <rect class="row" x="24" y="218" width="792" height="34" rx="4"/>
    <rect class="green" x="34" y="225" width="110" height="20" rx="4"/><text class="badge" x="89" y="239">CAUGHT 22s</text>
    <text class="st" x="158" y="234">6  Kerberoasting</text>
    <text class="sd" x="158" y="247">SOC-01 rule 100203 fired on the odd ticket request</text>

    <rect class="row" x="24" y="256" width="792" height="34" rx="4"/>
    <rect class="red"   x="34" y="263" width="110" height="20" rx="4"/><text class="badge" x="89" y="277">MISSED</text>
    <text class="st" x="158" y="272">7  AD CS ESC1, the step that took the domain</text>
    <text class="sd" x="158" y="285">No certificate auditing at all. The worst gap in the environment</text>

    <rect class="row" x="24" y="294" width="792" height="34" rx="4"/>
    <rect class="amber" x="34" y="301" width="110" height="20" rx="4"/><text class="badge" x="89" y="315">ON HUNT</text>
    <text class="st" x="158" y="310">8  DCSync</text>
    <text class="sd" x="158" y="323">No live rule. Found afterward by the SOC-03 hunt process</text>

    <rect class="row" x="24" y="332" width="792" height="34" rx="4"/>
    <rect class="green" x="34" y="339" width="110" height="20" rx="4"/><text class="badge" x="89" y="353">CAUGHT</text>
    <text class="st" x="158" y="348">9  Lateral movement to SQL01</text>
    <text class="sd" x="158" y="361">SOC-01 rule 100603 fired on service creation on a sensitive host</text>
  </g>

  <text class="key" x="24" y="392">Green caught live.  Amber visible but not alerted.  Red missed.</text>
  <text class="foot" x="24" y="414">Half the path went through without a live alert. Each gap becomes a defensive recommendation in the report, mostly pointing existing tools at new questions.</text>
</svg>
