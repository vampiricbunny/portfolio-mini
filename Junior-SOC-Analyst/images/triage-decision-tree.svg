<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" role="img" aria-labelledby="t d">
  <title id="t">Alert triage decision flow</title>
  <desc id="d">Three questions asked in order on every alert. First, is it real: read the raw event, and if the rule misfired close it as a false positive and tune. Second, is it authorised: check the change calendar, and if it was sanctioned work close it as a true positive that was authorised rather than as a false positive. Third, is it contained: establish how many hosts and accounts are involved and whether it is still running, which decides between monitoring and escalation. A warning notes the most common mistake, which is answering question three first and isolating machines before establishing that anything happened.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .q    { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.6; }
    .out  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
    .esc  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
    .fp   { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.4; }
    .warn { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.3; }
    .flow { stroke: #656d76; stroke-width: 1.8; marker-end: url(#a); fill: none; }
    .h1   { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub  { fill: #656d76; font-size: 11.5px; }
    .qn   { fill: #1f2328; font-size: 13.5px; font-weight: 600; }
    .qd   { fill: #424a53; font-size: 11px; }
    .on   { fill: #1f2328; font-size: 12px; font-weight: 600; }
    .od   { fill: #424a53; font-size: 10.5px; }
    .edge { fill: #656d76; font-size: 11px; font-weight: 600; }
    .wt   { fill: #9a6700; font-size: 11px; }
    .arrow{ fill: #656d76; }

    @media (prefers-color-scheme: dark) {
      .q    { fill: #0c2d6b; stroke: #58a6ff; }
      .out  { fill: #0d1117; stroke: #30363d; }
      .esc  { fill: #3c1618; stroke: #f85149; }
      .fp   { fill: #0f2f17; stroke: #3fb950; }
      .warn { fill: #4a3808; stroke: #d29922; }
      .flow { stroke: #8b949e; }
      .h1   { fill: #e6edf3; }
      .sub  { fill: #8b949e; }
      .qn   { fill: #e6edf3; }
      .qd   { fill: #b1bac4; }
      .on   { fill: #e6edf3; }
      .od   { fill: #b1bac4; }
      .edge { fill: #8b949e; }
      .wt   { fill: #d29922; }
      .arrow{ fill: #8b949e; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <text class="h1"  x="30" y="32">Alert triage  ·  three questions, in this order</text>
  <text class="sub" x="30" y="52">Most alerts die at question one or two. The ones that survive all three are incidents.</text>

  <!-- Q1 -->
  <rect class="q" x="30" y="78" width="300" height="70" rx="7"/>
  <text class="qn" x="46" y="104">1.  Is it real?</text>
  <text class="qd" x="46" y="124">Read the raw event, not the alert title.</text>
  <text class="qd" x="46" y="140">Did the described thing actually happen.</text>

  <line class="flow" x1="330" y1="102" x2="440" y2="102"/>
  <text class="edge" x="356" y="94">no</text>
  <rect class="fp" x="444" y="78" width="306" height="70" rx="7"/>
  <text class="on" x="460" y="104">Close: false positive</text>
  <text class="od" x="460" y="124">Tune the rule. Record what you excluded</text>
  <text class="od" x="460" y="140">and why, or it becomes a mystery later.</text>

  <line class="flow" x1="180" y1="148" x2="180" y2="196"/>
  <text class="edge" x="188" y="176">yes</text>

  <!-- Q2 -->
  <rect class="q" x="30" y="200" width="300" height="70" rx="7"/>
  <text class="qn" x="46" y="226">2.  Is it authorised?</text>
  <text class="qd" x="46" y="246">Check the change calendar first.</text>
  <text class="qd" x="46" y="262">This resolves more alerts than anything else.</text>

  <line class="flow" x1="330" y1="224" x2="440" y2="224"/>
  <text class="edge" x="356" y="216">yes</text>
  <rect class="out" x="444" y="200" width="306" height="70" rx="7"/>
  <text class="on" x="460" y="226">Close: true positive, authorised</text>
  <text class="od" x="460" y="246">Not a false positive. The rule was right.</text>
  <text class="od" x="460" y="262">Closing it as an FP implies bad tuning.</text>

  <line class="flow" x1="180" y1="270" x2="180" y2="318"/>
  <text class="edge" x="188" y="298">no</text>

  <!-- Q3 -->
  <rect class="q" x="30" y="322" width="300" height="86" rx="7"/>
  <text class="qn" x="46" y="348">3.  Is it contained?</text>
  <text class="qd" x="46" y="368">One host or many. One account or many.</text>
  <text class="qd" x="46" y="384">Still running or finished.</text>
  <text class="qd" x="46" y="400">Any privileged account involved.</text>

  <line class="flow" x1="330" y1="346" x2="440" y2="346"/>
  <text class="edge" x="350" y="338">single host</text>
  <rect class="out" x="444" y="314" width="306" height="56" rx="7"/>
  <text class="on" x="460" y="338">Contain, document, monitor</text>
  <text class="od" x="460" y="358">Document before you remove anything.</text>

  <line class="flow" x1="330" y1="386" x2="440" y2="400"/>
  <text class="edge" x="344" y="404">spreading</text>
  <rect class="esc" x="444" y="382" width="306" height="56" rx="7"/>
  <text class="on" x="460" y="406">Escalate. Open an incident</text>
  <text class="od" x="460" y="426">Credential access escalates immediately, always.</text>

  <!-- warning -->
  <rect class="warn" x="30" y="446" width="720" height="52" rx="7"/>
  <text class="wt" x="46" y="470">The most common Tier 1 mistake is answering question three first: isolating machines before establishing that anything</text>
  <text class="wt" x="46" y="488">happened, and taking a department offline over a misfiring rule. Establish real, then authorised, then scope.</text>
</svg>
