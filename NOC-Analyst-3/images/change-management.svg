<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="t d">
  <title id="t">The change management flow</title>
  <desc id="d">Five steps in order. Propose the change in NetBox. Review it, with a rollback plan. Schedule it in a change window. Deploy it through automation, never by hand. Verify it worked and record it. A note says this is lightweight discipline, not bureaucracy, and it prevents the undocumented change that caused the outage.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11.5px; }
    .s1 { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .s2 { fill: #e7defb; stroke: #8250df; stroke-width: 1.4; }
    .s3 { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.4; }
    .s4 { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.4; }
    .s5 { fill: #ffe8cc; stroke: #e16f24; stroke-width: 1.4; }
    .num{ fill: #0550ae; font-size: 12px; font-weight: 700; }
    .nm { fill: #1f2328; font-size: 12px; font-weight: 700; }
    .d  { fill: #424a53; font-size: 10px; }
    .flow{ stroke: #656d76; stroke-width: 2; fill: none; marker-end: url(#a); }
    .arrow{ fill: #656d76; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; }
      .s1 { fill: #0c2d6b; stroke: #58a6ff; } .s2 { fill: #2a1a4d; stroke: #a371f7; } .s3 { fill: #4a3808; stroke: #d29922; }
      .s4 { fill: #0f2f17; stroke: #3fb950; } .s5 { fill: #3a1e0d; stroke: #e16f24; }
      .num { fill: #79c0ff; } .nm { fill: #e6edf3; } .d { fill: #b1bac4; }
      .flow{ stroke: #8b949e; } .arrow { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker>
  </defs>
  <text class="h1"  x="24" y="30">Change management</text>
  <text class="sub" x="24" y="49">Lightweight discipline, not bureaucracy. It prevents the undocumented change that caused the outage.</text>

  <rect class="s1" x="24"  y="96" width="148" height="92" rx="8"/>
  <text class="num" x="40" y="120">1</text><text class="nm" x="58" y="120">Propose</text>
  <text class="d" x="40" y="146">The change goes</text><text class="d" x="40" y="161">into NetBox first</text>

  <rect class="s2" x="196" y="96" width="148" height="92" rx="8"/>
  <text class="num" x="212" y="120">2</text><text class="nm" x="230" y="120">Review</text>
  <text class="d" x="212" y="146">With a rollback</text><text class="d" x="212" y="161">plan, always</text>

  <rect class="s3" x="368" y="96" width="148" height="92" rx="8"/>
  <text class="num" x="384" y="120">3</text><text class="nm" x="402" y="120">Schedule</text>
  <text class="d" x="384" y="146">In a change</text><text class="d" x="384" y="161">window</text>

  <rect class="s4" x="540" y="96" width="148" height="92" rx="8"/>
  <text class="num" x="556" y="120">4</text><text class="nm" x="574" y="120">Deploy</text>
  <text class="d" x="556" y="146">Through automation,</text><text class="d" x="556" y="161">never by hand</text>

  <rect class="s5" x="712" y="96" width="124" height="92" rx="8"/>
  <text class="num" x="728" y="120">5</text><text class="nm" x="746" y="120">Verify</text>
  <text class="d" x="728" y="146">Confirm and</text><text class="d" x="728" y="161">record it</text>

  <line class="flow" x1="172" y1="142" x2="194" y2="142"/>
  <line class="flow" x1="344" y1="142" x2="366" y2="142"/>
  <line class="flow" x1="516" y1="142" x2="538" y2="142"/>
  <line class="flow" x1="688" y1="142" x2="710" y2="142"/>

  <text class="foot" x="24" y="236">A one-person lab does not need a committee. It needs every change written down, reversible, and deployed the same repeatable way.</text>
  <text class="foot" x="24" y="256">The alternative is exactly the outage this project opened with: a quiet, undocumented change that nobody could see.</text>
</svg>
