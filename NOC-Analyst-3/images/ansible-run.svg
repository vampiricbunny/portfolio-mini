<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="t d">
  <title id="t">An Ansible run deploying config from the source of truth, schematic</title>
  <desc id="d">A drawn terminal showing an Ansible playbook run that deploys network config from NetBox. The play gathers facts, renders config from the source of truth, and applies it to each device. The recap at the bottom shows the standby firewall had one change, correcting the drift, while the others report ok with zero changes, which proves they already matched intended state. Numbered callouts mark the drift correction and the zero-change hosts. A footer states this is a schematic illustration and not a screen capture.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .term { fill: #0d1117; stroke: #30363d; stroke-width: 1.3; }
    .bar  { fill: #161b22; }
    .prompt { fill: #7ee787; font-size: 12px; }
    .cmd  { fill: #e6edf3; font-size: 12px; }
    .play { fill: #d2a8ff; font-size: 11.5px; font-weight: 700; }
    .ok   { fill: #7ee787; font-size: 11.5px; }
    .chg  { fill: #e3b341; font-size: 11.5px; font-weight: 700; }
    .dim  { fill: #8b949e; font-size: 11.5px; }
    .cnum{ fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .cc  { fill: #cf222e; stroke: #ffffff; stroke-width: 1.2; }
    .clbl{ fill: #a40e26; font-size: 10.5px; font-weight: 700; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } .clbl { fill: #ff7b72; } }
  </style>
  <text class="h1"  x="20" y="26">Ansible, deploy from the source of truth</text>
  <text class="sub" x="20" y="44">Render config from NetBox, apply it, and prove intended equals actual.</text>

  <rect class="term" x="20" y="58" width="580" height="356" rx="7"/>
  <rect class="bar"  x="20" y="58" width="580" height="26" rx="7"/>
  <circle cx="36" cy="71" r="4.5" fill="#ff5f56"/>
  <circle cx="52" cy="71" r="4.5" fill="#ffbd2e"/>
  <circle cx="68" cy="71" r="4.5" fill="#27c93f"/>
  <text class="mono dim" x="280" y="75">noc@mgmt: ~/network-as-code</text>

  <text class="mono prompt" x="34" y="106">$ <tspan class="cmd">ansible-playbook deploy-network.yml</tspan></text>
  <text class="mono play" x="34" y="130">PLAY [all network devices]</text>
  <text class="mono dim"  x="34" y="150">TASK [gather facts] ok</text>
  <text class="mono dim"  x="34" y="168">TASK [render config from NetBox] ok</text>
  <text class="mono dim"  x="34" y="186">TASK [apply interface config]</text>
  <text class="mono ok"   x="50" y="204">ok: [CORE-RTR]</text>
  <text class="mono ok"   x="50" y="222">ok: [CORE-SW]</text>
  <text class="mono ok"   x="50" y="240">ok: [FW01]</text>
  <text class="mono chg"  x="50" y="258">changed: [FW-STANDBY]  priority 80 to 100</text>

  <text class="mono play" x="34" y="288">PLAY RECAP</text>
  <text class="mono ok"   x="34" y="308">CORE-RTR   : ok=4  changed=0  failed=0</text>
  <text class="mono ok"   x="34" y="326">CORE-SW    : ok=4  changed=0  failed=0</text>
  <text class="mono ok"   x="34" y="344">FW01       : ok=4  changed=0  failed=0</text>
  <text class="mono chg"  x="34" y="362">FW-STANDBY : ok=4  changed=1  failed=0</text>
  <text class="mono prompt" x="34" y="390">$ <tspan class="cmd">_</tspan></text>

  <!-- callouts -->
  <circle class="cc" cx="560" cy="258" r="12"/><text class="cnum" x="560" y="262">1</text>
  <circle class="cc" cx="560" cy="362" r="12"/><text class="cnum" x="560" y="366">1</text>
  <circle class="cc" cx="560" cy="317" r="12"/><text class="cnum" x="560" y="321">2</text>

  <text class="clbl" x="620" y="250">1  The drift, corrected.</text>
  <text class="clbl" x="620" y="266">The standby priority was</text>
  <text class="clbl" x="620" y="282">wrong, now put right and</text>
  <text class="clbl" x="620" y="298">owned by automation.</text>

  <text class="clbl" x="620" y="330">2  changed=0 everywhere</text>
  <text class="clbl" x="620" y="346">else. That zero is the</text>
  <text class="clbl" x="620" y="362">proof: actual already</text>
  <text class="clbl" x="620" y="378">matched intended. No drift.</text>

  <text class="foot" x="20" y="432">Schematic illustration of an Ansible run, not a screen capture. A run with zero changes is the healthiest output there is: the network is exactly as designed.</text>
</svg>
