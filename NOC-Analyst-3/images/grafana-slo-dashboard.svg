<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d">
  <title id="t">The Grafana SLO and error-budget dashboard, schematic</title>
  <desc id="d">A drawn Grafana dashboard for service-level objectives. A row of stat tiles shows the availability SLO at 99.9 percent, current availability at 99.96 percent, error budget remaining at 48 percent, and the burn rate as normal. Below, an error-budget burn-down chart over the month shows a sharp drop at the outage then a steady line, staying above zero. A footer states this is a schematic illustration and not a screen capture.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .app { fill: #0d1117; stroke: #30363d; stroke-width: 1.3; }
    .bar { fill: #161b22; }
    .tile{ fill: #161b22; stroke: #30363d; stroke-width: 1.1; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .appt{ fill: #e6edf3; font-size: 12px; font-weight: 700; }
    .tl { fill: #8b949e; font-size: 10.5px; }
    .big{ fill: #e6edf3; font-size: 28px; font-weight: 700; }
    .good{ fill: #3fb950; font-size: 24px; font-weight: 700; }
    .warn{ fill: #d29922; font-size: 24px; font-weight: 700; }
    .unit{ fill: #8b949e; font-size: 11px; }
    .cap{ fill: #8b949e; font-size: 10.5px; font-weight: 700; }
    .grid{ stroke: #30363d; stroke-width: 1; }
    .budget{ stroke: #3fb950; stroke-width: 2.4; fill: none; }
    .budgetf{ fill: #12361d; opacity: 0.6; }
    .axl{ fill: #8b949e; font-size: 9px; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } }
  </style>
  <text class="h1"  x="20" y="26">Grafana, SLO and error budget</text>
  <text class="sub" x="20" y="44">Reliability measured as a promise and a budget, not raw uptime.</text>

  <rect class="app" x="20" y="58" width="820" height="384" rx="6"/>
  <rect class="bar" x="20" y="58" width="820" height="28" rx="6"/>
  <text class="appt" x="36" y="77">Grafana  &gt;  Reliability  &gt;  SLO overview</text>

  <!-- stat tiles -->
  <rect class="tile" x="36"  y="100" width="188" height="104" rx="6"/>
  <text class="tl"  x="52" y="124">Availability SLO</text>
  <text class="big" x="52" y="166">99.9<tspan class="unit"> pct</tspan></text>
  <text class="tl"  x="52" y="190">the promise</text>

  <rect class="tile" x="236" y="100" width="188" height="104" rx="6"/>
  <text class="tl"  x="252" y="124">Current availability</text>
  <text class="good" x="252" y="166">99.96<tspan class="unit"> pct</tspan></text>
  <text class="tl"  x="252" y="190">above target</text>

  <rect class="tile" x="436" y="100" width="188" height="104" rx="6"/>
  <text class="tl"  x="452" y="124">Error budget left</text>
  <text class="warn" x="452" y="166">48<tspan class="unit"> pct</tspan></text>
  <text class="tl"  x="452" y="190">half spent at the outage</text>

  <rect class="tile" x="636" y="100" width="188" height="104" rx="6"/>
  <text class="tl"  x="652" y="124">Burn rate</text>
  <text class="good" x="652" y="166">Normal</text>
  <text class="tl"  x="652" y="190">no fast burn now</text>

  <!-- burn-down chart -->
  <rect class="tile" x="36" y="222" width="788" height="196" rx="6"/>
  <text class="cap" x="52" y="246">Error budget burn-down, this month</text>
  <!-- plot area x 70..800 y 262..392 -->
  <line class="grid" x1="70" y1="270" x2="800" y2="270"/>
  <line class="grid" x1="70" y1="310" x2="800" y2="310"/>
  <line class="grid" x1="70" y1="350" x2="800" y2="350"/>
  <line class="grid" x1="70" y1="390" x2="800" y2="390"/>
  <text class="axl" x="48" y="274">100</text>
  <text class="axl" x="54" y="352">50</text>
  <text class="axl" x="58" y="392">0</text>
  <!-- budget line: flat near top, sharp drop at outage (~x=360), then gentle -->
  <polygon class="budgetf" points="70,272 350,286 360,330 800,352 800,392 70,392"/>
  <polyline class="budget" points="70,272 350,286 360,330 520,338 800,352"/>
  <text class="axl" x="330" y="316" fill="#d29922">outage, 50 pct spent</text>
  <text class="axl" x="70" y="410">day 1</text>
  <text class="axl" x="760" y="410">day 30</text>

  <text class="foot" x="20" y="456">Schematic illustration of a Grafana dashboard, not a screen capture. The budget absorbed the outage and stayed above zero, which is exactly its job.</text>
</svg>
