<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-labelledby="t d">
  <title id="t">The network lab and the reliability stack</title>
  <desc id="d">The monitored network on the left feeds telemetry into the reliability stack on the right. The network has a core router, a core switch, a firewall and access switches across four subnets. Telemetry flows into LibreNMS and Prometheus, visualised in Grafana. Alertmanager routes alerts. NetBox holds the intended state and Ansible deploys it. A status page communicates outages. A note says the same network as NOC-02, now run as a reliability function.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11.5px; }
    .zone{ fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
    .zl { fill: #57606a; font-size: 10.5px; font-weight: 700; }
    .host{ fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .hn { fill: #1f2328; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
    .core{ fill: #cfe4ff; stroke: #0a6ed1; stroke-width: 1.6; }
    .tool{ fill: #ddf4ff; stroke: #218bff; stroke-width: 1.3; }
    .tn { fill: #1f2328; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .ti { fill: #57606a; font-size: 9px; text-anchor: middle; }
    .flow{ stroke: #0a6ed1; stroke-width: 2; fill: none; marker-end: url(#b); }
    .arrow{ fill: #0a6ed1; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; }
      .zone { fill: #161b22; stroke: #30363d; } .zl { fill: #8b949e; }
      .host { fill: #0d1117; stroke: #6e7681; } .hn { fill: #e6edf3; }
      .core { fill: #0c2d6b; stroke: #58a6ff; } .tool { fill: #10263f; stroke: #58a6ff; }
      .tn { fill: #e6edf3; } .ti { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker>
  </defs>
  <text class="h1"  x="24" y="30">The network and the reliability stack</text>
  <text class="sub" x="24" y="49">The monitored network feeds the tooling. Same network as NOC-02, now run as a function.</text>

  <rect class="zone" x="24" y="70" width="300" height="320" rx="7"/>
  <text class="zl" x="40" y="92">MONITORED NETWORK  10.60.0.0/24</text>
  <rect class="core" x="100" y="106" width="150" height="46" rx="5"/><text class="hn" x="175" y="134">CORE-RTR</text>
  <rect class="core" x="100" y="162" width="150" height="46" rx="5"/><text class="hn" x="175" y="190">CORE-SW</text>
  <rect class="host" x="44"  y="218" width="120" height="44" rx="5"/><text class="hn" x="104" y="245">FW01</text>
  <rect class="host" x="184" y="218" width="120" height="44" rx="5"/><text class="hn" x="244" y="245">STANDBY</text>
  <rect class="host" x="44"  y="272" width="120" height="44" rx="5"/><text class="hn" x="104" y="299">ACC-SW1</text>
  <rect class="host" x="184" y="272" width="120" height="44" rx="5"/><text class="hn" x="244" y="299">ACC-SW2</text>
  <text class="ti" x="174" y="340">4 subnets, SNMP and exporters</text>
  <text class="ti" x="174" y="356">on every device, from NOC-02</text>

  <!-- monitoring centre -->
  <rect class="core" x="372" y="150" width="180" height="70" rx="7"/>
  <text class="tn" x="462" y="182">LibreNMS + Prometheus</text>
  <text class="ti" x="462" y="200">metrics, into Grafana</text>

  <!-- tools right -->
  <rect class="tool" x="604" y="74"  width="210" height="50" rx="6"/>
  <text class="tn" x="709" y="96">Grafana</text><text class="ti" x="709" y="112">dashboards and SLOs</text>
  <rect class="tool" x="604" y="132" width="210" height="50" rx="6"/>
  <text class="tn" x="709" y="154">Alertmanager</text><text class="ti" x="709" y="170">routing and on-call</text>
  <rect class="tool" x="604" y="190" width="210" height="50" rx="6"/>
  <text class="tn" x="709" y="212">NetBox + Ansible</text><text class="ti" x="709" y="228">source of truth, deploy</text>
  <rect class="tool" x="604" y="248" width="210" height="50" rx="6"/>
  <text class="tn" x="709" y="270">Status page</text><text class="ti" x="709" y="286">plain-language comms</text>

  <line class="flow" x1="324" y1="185" x2="370" y2="185"/>
  <line class="flow" x1="552" y1="172" x2="602" y2="104"/>
  <line class="flow" x1="552" y1="180" x2="602" y2="158"/>
  <line class="flow" x1="552" y1="192" x2="602" y2="214"/>
  <line class="flow" x1="552" y1="202" x2="602" y2="270"/>

  <text class="foot" x="24" y="410">Telemetry flows left to right. NetBox and Ansible close the loop back onto the network, keeping intended state and actual state equal.</text>
</svg>
