<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d">
  <title id="t">The Alertmanager routing and on-call console, schematic</title>
  <desc id="d">A drawn Alertmanager view. The left shows the routing tree: a root route that splits by severity, critical pages on-call, warning goes to the team channel, and info is recorded only. An inhibition rule mutes downstream alerts when a parent is down. The centre shows active alerts, one critical burn-rate alert firing, grouped. The right shows the on-call schedule and the escalation policy. A footer states this is a schematic illustration and not a screen capture.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .app { fill: #0f1115; stroke: #2b2f36; stroke-width: 1.3; }
    .bar { fill: #c0392b; }
    .panel { fill: #171a1f; stroke: #2b2f36; stroke-width: 1.1; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .appt{ fill: #ffffff; font-size: 12px; font-weight: 700; }
    .colt{ fill: #e6a23c; font-size: 11px; font-weight: 700; }
    .node{ fill: #1f242b; stroke: #566; stroke-width: 1.1; }
    .ncrit{ fill: #3d1417; stroke: #f85149; stroke-width: 1.4; }
    .nwarn{ fill: #3a2f08; stroke: #d4a72c; stroke-width: 1.2; }
    .ninfo{ fill: #1f242b; stroke: #6e7681; stroke-width: 1.1; }
    .nt { fill: #e6edf3; font-size: 10px; font-weight: 700; }
    .nd { fill: #9aa4b2; font-size: 9px; }
    .edge{ stroke: #566; stroke-width: 1.4; fill: none; }
    .firing{ fill: #cf222e; }
    .ft { fill: #ffffff; font-size: 10px; font-weight: 700; }
    .lbl{ fill: #9aa4b2; font-size: 10px; }
    .val{ fill: #e6edf3; font-size: 10.5px; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } }
  </style>
  <text class="h1"  x="20" y="26">Alertmanager, routing and on-call</text>
  <text class="sub" x="20" y="44">What pages a human, what waits for morning, and who gets woken.</text>

  <rect class="app" x="20" y="58" width="820" height="384" rx="6"/>
  <rect class="bar" x="20" y="58" width="820" height="28" rx="6"/>
  <text class="appt" x="36" y="77">Alertmanager  &gt;  routes and alerts</text>

  <!-- routing tree -->
  <rect class="panel" x="34" y="98" width="288" height="326" rx="5"/>
  <text class="colt" x="50" y="120">Routing tree</text>
  <rect class="node" x="118" y="134" width="120" height="34" rx="5"/><text class="nt" x="134" y="150">root route</text><text class="nd" x="134" y="162">group by alertname</text>
  <rect class="ncrit" x="48" y="196" width="120" height="40" rx="5"/><text class="nt" x="62" y="214">critical</text><text class="nd" x="62" y="228">page on-call</text>
  <rect class="nwarn" x="188" y="196" width="120" height="40" rx="5"/><text class="nt" x="202" y="214">warning</text><text class="nd" x="202" y="228">team channel</text>
  <rect class="ninfo" x="118" y="258" width="120" height="40" rx="5"/><text class="nt" x="132" y="276">info</text><text class="nd" x="132" y="290">record only</text>
  <path class="edge" d="M 150 168 L 108 194"/>
  <path class="edge" d="M 208 168 L 248 194"/>
  <path class="edge" d="M 178 236 L 178 256"/>
  <text class="lbl" x="50" y="326">Inhibition rule</text>
  <text class="val" x="50" y="344">If CORE-RTR is down,</text>
  <text class="val" x="50" y="360">mute everything behind it.</text>
  <text class="val" x="50" y="376">One alert, not a hundred.</text>

  <!-- active alerts -->
  <rect class="panel" x="334" y="98" width="268" height="326" rx="5"/>
  <text class="colt" x="350" y="120">Active alerts</text>
  <rect class="firing" x="350" y="134" width="236" height="56" rx="5"/>
  <text class="ft" x="364" y="154">CRITICAL  ErrorBudgetBurnFast</text>
  <text class="ft" x="364" y="172" font-size="9" fill="#ffd0cc">burning at 14x, will exhaust in 2h</text>
  <text class="ft" x="364" y="184" font-size="9" fill="#ffd0cc">paged on-call, acknowledged</text>
  <text class="lbl" x="350" y="214">Grouped with</text>
  <text class="val" x="350" y="234">PacketLoss CORE-RTR uplink</text>
  <text class="val" x="350" y="252">LatencyHigh subnet 10.60.2</text>
  <text class="lbl" x="350" y="286">Suppressed by inhibition</text>
  <text class="val" x="350" y="306">17 downstream alerts muted</text>
  <text class="val" x="350" y="324">so the pager fired once</text>
  <text class="sub" x="350" y="360" font-size="9.5">Page on burn rate, not on a single</text>
  <text class="sub" x="350" y="374" font-size="9.5">failed check. That is the strategy.</text>

  <!-- on-call -->
  <rect class="panel" x="614" y="98" width="210" height="326" rx="5"/>
  <text class="colt" x="630" y="120">On-call</text>
  <text class="lbl" x="630" y="146">Primary</text><text class="val" x="630" y="162">this week, vbunny</text>
  <text class="lbl" x="630" y="188">Escalation</text>
  <text class="val" x="630" y="208">1  page primary</text>
  <text class="val" x="630" y="226">2  after 10 min, backup</text>
  <text class="val" x="630" y="244">3  after 20 min, lead</text>
  <text class="lbl" x="630" y="276">Quiet hours</text>
  <text class="val" x="630" y="296">only critical pages</text>
  <text class="val" x="630" y="314">overnight</text>
  <text class="lbl" x="630" y="346">Goal</text>
  <text class="val" x="630" y="366">sustainable rotation,</text>
  <text class="val" x="630" y="384">no hero culture</text>

  <text class="foot" x="20" y="456">Schematic illustration of Alertmanager, not a screen capture. The whole design serves one rule: wake a human only for what actually threatens the promise.</text>
</svg>
