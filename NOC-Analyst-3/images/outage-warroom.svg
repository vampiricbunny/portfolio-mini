<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-labelledby="t d">
  <title id="t">The outage command war-room board</title>
  <desc id="d">An incident command board for the network outage. A header shows the incident, severity one, status restoring, and the incident commander. An objective banner reads restore service first, diagnose after. Three columns: roles and owners, the live action list with states, and a communications panel with the next update time and who is informed.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .board { fill: #0f1420; stroke: #243049; stroke-width: 1.3; }
    .hdr { fill: #182238; }
    .col { fill: #141c2e; stroke: #243049; stroke-width: 1.1; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .ht { fill: #ffffff; font-size: 13px; font-weight: 700; }
    .sev{ fill: #cf222e; }
    .sevt{ fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .colt{ fill: #7fb2ff; font-size: 11px; font-weight: 700; }
    .lbl{ fill: #9fb3c8; font-size: 10px; }
    .val{ fill: #e6edf3; font-size: 10.5px; font-weight: 600; }
    .done{ fill: #2ea043; } .wip{ fill: #d4a72c; } .todo{ fill: #6e7681; }
    .pill{ font-size: 8.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .obj{ fill: #3d2c05; stroke: #d4a72c; stroke-width: 1.4; }
    .objt{ fill: #ffd37a; font-size: 12px; font-weight: 700; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } }
  </style>
  <text class="h1"  x="20" y="26">Outage command, the war-room board</text>
  <text class="sub" x="20" y="44">Not fixing the outage. Directing it: what restores fastest, who does it, who is told.</text>

  <rect class="board" x="20" y="58" width="820" height="414" rx="6"/>
  <rect class="hdr"   x="20" y="58" width="820" height="52" rx="6"/>
  <text class="ht" x="36" y="82">INC-NET-07  Partial outage, core uplink degraded</text>
  <rect class="sev" x="36" y="88" width="68" height="16" rx="3"/><text class="sevt" x="70" y="100">SEV 1</text>
  <text class="val" x="116" y="100">Status: Restoring</text>
  <text class="lbl" x="560" y="82">Incident commander</text><text class="val" x="560" y="100">vbunny</text>
  <text class="lbl" x="700" y="82">Declared</text><text class="val" x="700" y="100">T plus 6 min</text>

  <rect class="obj" x="36" y="122" width="788" height="36" rx="5"/>
  <text class="objt" x="52" y="145">Current objective: restore service first, diagnose the cause after. Stop the bleeding.</text>

  <!-- roles -->
  <rect class="col" x="36" y="172" width="248" height="282" rx="5"/>
  <text class="colt" x="52" y="194">Roles</text>
  <text class="lbl" x="52" y="218">Incident commander</text><text class="val" x="52" y="234">vbunny, decisions and comms</text>
  <text class="lbl" x="52" y="262">Ops lead</text><text class="val" x="52" y="278">works the devices</text>
  <text class="lbl" x="52" y="306">Comms</text><text class="val" x="52" y="322">owns the status page</text>
  <text class="lbl" x="52" y="350">Scribe</text><text class="val" x="52" y="366">owns the timeline log</text>
  <text class="lbl" x="52" y="394">Liaison</text><text class="val" x="52" y="410">owns stakeholder updates</text>
  <text class="sub" x="52" y="440" font-size="9.5">One person in a lab, played in sequence.</text>

  <!-- actions -->
  <rect class="col" x="296" y="172" width="286" height="282" rx="5"/>
  <text class="colt" x="312" y="194">Action list</text>
  <rect class="done" x="312" y="208" width="46" height="16" rx="8"/><text class="pill" x="335" y="220">DONE</text>
  <text class="val" x="368" y="220">Confirm impact and scope</text>
  <rect class="done" x="312" y="234" width="46" height="16" rx="8"/><text class="pill" x="335" y="246">DONE</text>
  <text class="val" x="368" y="246">Post to status page</text>
  <rect class="done" x="312" y="260" width="46" height="16" rx="8"/><text class="pill" x="335" y="272">DONE</text>
  <text class="val" x="368" y="272">Force manual failover</text>
  <rect class="wip" x="312" y="286" width="46" height="16" rx="8"/><text class="pill" x="335" y="298">WIP</text>
  <text class="val" x="368" y="298">Verify service restored</text>
  <rect class="wip" x="312" y="312" width="46" height="16" rx="8"/><text class="pill" x="335" y="324">WIP</text>
  <text class="val" x="368" y="324">Find why failover failed</text>
  <rect class="todo" x="312" y="338" width="46" height="16" rx="8"/><text class="pill" x="335" y="350">TODO</text>
  <text class="val" x="368" y="350">Correct the standby config</text>
  <rect class="todo" x="312" y="364" width="46" height="16" rx="8"/><text class="pill" x="335" y="376">TODO</text>
  <text class="val" x="368" y="376">Place it under automation</text>
  <rect class="todo" x="312" y="390" width="46" height="16" rx="8"/><text class="pill" x="335" y="402">TODO</text>
  <text class="val" x="368" y="402">After-action review</text>
  <text class="sub" x="312" y="438" font-size="9.5">Restore first, understand after, always.</text>

  <!-- comms -->
  <rect class="col" x="594" y="172" width="230" height="282" rx="5"/>
  <text class="colt" x="610" y="194">Communications</text>
  <text class="lbl" x="610" y="218">Next update</text><text class="val" x="610" y="234">every 15 minutes</text>
  <text class="lbl" x="610" y="262">Informed</text>
  <text class="val" x="610" y="280">Help desk</text>
  <text class="val" x="610" y="298">IT manager</text>
  <text class="val" x="610" y="316">Affected users, via status page</text>
  <text class="lbl" x="610" y="346">Message style</text>
  <text class="val" x="610" y="364">Plain language.</text>
  <text class="val" x="610" y="382">What is broken,</text>
  <text class="val" x="610" y="400">what we are doing,</text>
  <text class="val" x="610" y="418">when the next update is.</text>

  <text class="foot" x="20" y="494"> The roles are real roles, played by one person in sequence in the lab.</text>
</svg>
