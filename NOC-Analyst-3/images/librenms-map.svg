<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="t d">
  <title id="t">The LibreNMS auto-discovered network map</title>
  <desc id="d">A LibreNMS network map. Device nodes for the core router, core switch, firewall, standby firewall and access switches are joined by links discovered automatically. Most links are green and healthy. One link, the degraded core uplink, is shown red and thick, which is how the outage was first seen. A side panel shows device counts up and down.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .app { fill: #11161d; stroke: #2b333f; stroke-width: 1.3; }
    .bar { fill: #1a212b; }
    .panel { fill: #18202a; stroke: #2b333f; stroke-width: 1.1; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .appt{ fill: #ffffff; font-size: 12px; font-weight: 700; }
    .link{ stroke: #2ea043; stroke-width: 3; }
    .linkdown{ stroke: #cf222e; stroke-width: 5; }
    .node{ fill: #1f6feb; stroke: #79c0ff; stroke-width: 1.5; }
    .ncore{ fill: #8250df; stroke: #c297ff; stroke-width: 1.6; }
    .ndown{ fill: #cf222e; stroke: #ffa198; stroke-width: 1.8; }
    .nl { fill: #ffffff; font-size: 10px; font-weight: 700; text-anchor: middle; }
    .lbl{ fill: #8fb3c2; font-size: 10px; }
    .val{ fill: #e6edf3; font-size: 11px; font-weight: 700; }
    .down{ fill: #ff7b72; font-size: 11px; font-weight: 700; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } }
  </style>
  <text class="h1"  x="20" y="26">LibreNMS, the auto-discovered map</text>
  <text class="sub" x="20" y="44">The network draws itself. A link went red here before anyone phoned in.</text>

  <rect class="app" x="20" y="58" width="800" height="340" rx="6"/>
  <rect class="bar" x="20" y="58" width="800" height="28" rx="6"/>
  <text class="appt" x="36" y="77">LibreNMS  &gt;  Maps  &gt;  Network</text>

  <!-- links first -->
  <line class="linkdown" x1="300" y1="150" x2="300" y2="230"/>
  <line class="link" x1="300" y1="150" x2="470" y2="150"/>
  <line class="link" x1="300" y1="230" x2="180" y2="300"/>
  <line class="link" x1="300" y1="230" x2="420" y2="300"/>
  <line class="link" x1="470" y1="150" x2="470" y2="230"/>

  <!-- nodes -->
  <circle class="ncore" cx="300" cy="150" r="30"/><text class="nl" x="300" y="148">CORE</text><text class="nl" x="300" y="160" font-size="8">RTR</text>
  <circle class="ndown" cx="300" cy="230" r="30"/><text class="nl" x="300" y="228">CORE</text><text class="nl" x="300" y="240" font-size="8">SW degraded</text>
  <circle class="node" cx="470" cy="150" r="28"/><text class="nl" x="470" y="148">FW01</text>
  <circle class="node" cx="470" cy="230" r="28"/><text class="nl" x="470" y="228">STANDBY</text>
  <circle class="node" cx="180" cy="300" r="26"/><text class="nl" x="180" y="304">ACC-SW1</text>
  <circle class="node" cx="420" cy="300" r="26"/><text class="nl" x="420" y="304">ACC-SW2</text>

  <text class="down" x="318" y="196">uplink degraded</text>

  <!-- side panel -->
  <rect class="panel" x="588" y="100" width="216" height="280" rx="5"/>
  <text class="val" x="604" y="126">Devices</text>
  <text class="lbl" x="604" y="152">Up</text><text class="val" x="760" y="152" text-anchor="end">5</text>
  <text class="lbl" x="604" y="178">Degraded</text><text class="down" x="760" y="178" text-anchor="end">1</text>
  <text class="lbl" x="604" y="204">Down</text><text class="val" x="760" y="204" text-anchor="end">0</text>
  <text class="val" x="604" y="240">Links</text>
  <text class="lbl" x="604" y="266">Healthy</text><text class="val" x="760" y="266" text-anchor="end">4</text>
  <text class="lbl" x="604" y="292">Alarming</text><text class="down" x="760" y="292" text-anchor="end">1</text>
  <text class="sub" x="604" y="334" font-size="9.5">Red is impossible to miss.</text>
  <text class="sub" x="604" y="350" font-size="9.5">That is the whole design.</text>

  <text class="foot" x="20" y="424"> Auto-discovery means the map is always current, so a failing link shows itself.</text>
</svg>
