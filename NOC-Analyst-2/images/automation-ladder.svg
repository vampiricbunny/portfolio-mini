<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
  <title id="t">The ladder from manual toil to automated self-healing</title>
  <desc id="d">Automation climbs a ladder of five rungs. Rung one, manual and undocumented, someone knows how to fix it in their head. Rung two, manual with a runbook, anyone can fix it by following steps. Rung three, scripted and run by a human. Rung four, automated with a human approving. Rung five, self-healing, the system fixes it and tells you. A note says most tasks should climb to rung two or three, and only some to rung five, because the goal is to automate the safe repetitive things and keep a human in the loop for the rest.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .r1 { fill: #eaeef2; stroke: #8c959f; stroke-width: 1.4; }
    .r2 { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .r3 { fill: #c7e4ff; stroke: #218bff; stroke-width: 1.4; }
    .r4 { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.4; }
    .r5 { fill: #b7f0c4; stroke: #2ea043; stroke-width: 1.6; }
    .h1 { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11.5px; }
    .n  { fill: #1f2328; font-size: 12px; font-weight: 700; }
    .t  { fill: #1f2328; font-size: 12.5px; font-weight: 700; }
    .d  { fill: #424a53; font-size: 10.5px; }
    .side { fill: #656d76; font-size: 11px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .r1 { fill: #21262d; stroke: #6e7681; } .r2 { fill: #0c2d6b; stroke: #58a6ff; }
      .r3 { fill: #133b7d; stroke: #58a6ff; } .r4 { fill: #0f2f17; stroke: #3fb950; }
      .r5 { fill: #163d20; stroke: #3fb950; }
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; }
      .n  { fill: #e6edf3; } .t { fill: #e6edf3; } .d { fill: #b1bac4; } .side { fill: #8b949e; }
    }
  </style>
  <text class="h1"  x="28" y="30">The automation ladder</text>
  <text class="sub" x="28" y="50">Automation is not all or nothing. Most tasks climb one rung at a time.</text>

  <!-- ascending steps, each wider band higher up -->
  <rect class="r1" x="60"  y="300" width="440" height="44" rx="6"/>
  <text class="n" x="76" y="320">Rung 1</text>
  <text class="d" x="150" y="320">Manual, undocumented. In someone's head.</text>

  <rect class="r2" x="90"  y="248" width="440" height="44" rx="6"/>
  <text class="n" x="106" y="268">Rung 2</text>
  <text class="d" x="180" y="268">Manual, with a runbook. Anyone can follow it.</text>

  <rect class="r3" x="120" y="196" width="440" height="44" rx="6"/>
  <text class="n" x="136" y="216">Rung 3</text>
  <text class="d" x="210" y="216">Scripted, run by a human.</text>

  <rect class="r4" x="150" y="144" width="440" height="44" rx="6"/>
  <text class="n" x="166" y="164">Rung 4</text>
  <text class="d" x="240" y="164">Automated, human approves.</text>

  <rect class="r5" x="180" y="92"  width="440" height="44" rx="6"/>
  <text class="n" x="196" y="112">Rung 5</text>
  <text class="d" x="270" y="112">Self-healing. Fixes it and tells you.</text>

  <text class="side" x="636" y="112">only some</text>
  <text class="side" x="636" y="130">tasks</text>
  <text class="side" x="636" y="250">most tasks</text>
  <text class="side" x="636" y="268">reach here</text>

  <text class="sub" x="28" y="372">Automate the toil, keep the judgement. Self-healing is only for safe, well-understood tasks with a clear success test.</text>
  <text class="sub" x="28" y="392">A NOC that automates judgement makes confident mistakes at machine speed.</text>
</svg>
