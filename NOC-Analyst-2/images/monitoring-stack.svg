<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="t d">
  <title id="t">The observability stack, from device to dashboard to alert</title>
  <desc id="d">Devices at the bottom emit three kinds of data. SNMP metrics go to LibreNMS, the traditional network monitoring tool. Time-series metrics from exporters go to Prometheus. Flow records go to ntopng, and syslog goes to a log aggregator. LibreNMS and Prometheus both feed Grafana, which draws the dashboards. Prometheus also feeds Alertmanager, which routes alerts. The point is that a real NOC runs the traditional SNMP world and the modern time-series world side by side.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .dev  { fill: #eaeef2; stroke: #8c959f; stroke-width: 1.4; }
    .snmp { fill: #fff1e5; stroke: #fb8f44; stroke-width: 1.5; }
    .prom { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.5; }
    .flow { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.5; }
    .graf { fill: #ecd8ff; stroke: #8250df; stroke-width: 1.6; }
    .alert{ fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
    .f    { stroke: #656d76; stroke-width: 1.7; marker-end: url(#a); fill: none; }
    .arrow{ fill: #656d76; }
    .h1   { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub  { fill: #656d76; font-size: 11.5px; }
    .t    { fill: #1f2328; font-size: 12px; font-weight: 700; }
    .d    { fill: #424a53; font-size: 10px; }
    .lbl  { fill: #656d76; font-size: 9.5px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .dev  { fill: #21262d; stroke: #6e7681; }
      .snmp { fill: #4a2610; stroke: #db6d28; } .prom { fill: #0c2d6b; stroke: #58a6ff; }
      .flow { fill: #0f2f17; stroke: #3fb950; } .graf { fill: #3c1e70; stroke: #bc8cff; }
      .alert{ fill: #3c1618; stroke: #f85149; }
      .f    { stroke: #8b949e; } .arrow { fill: #8b949e; }
      .h1   { fill: #e6edf3; } .sub { fill: #8b949e; }
      .t    { fill: #e6edf3; } .d { fill: #b1bac4; } .lbl { fill: #8b949e; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker></defs>
  <text class="h1"  x="28" y="30">The monitoring stack</text>
  <text class="sub" x="28" y="50">Traditional SNMP and modern time-series, side by side, because a real NOC runs both.</text>

  <!-- devices -->
  <rect class="dev" x="290" y="70" width="240" height="44" rx="6"/>
  <text class="t" x="360" y="97">Devices and servers</text>

  <!-- data types -->
  <line class="f" x1="340" y1="114" x2="150" y2="160"/><text class="lbl" x="200" y="135">SNMP</text>
  <line class="f" x1="400" y1="114" x2="400" y2="160"/><text class="lbl" x="408" y="138">metrics</text>
  <line class="f" x1="470" y1="114" x2="650" y2="160"/><text class="lbl" x="560" y="135">flow, syslog</text>

  <!-- collectors -->
  <rect class="snmp" x="60" y="164" width="180" height="56" rx="6"/>
  <text class="t" x="76" y="188">LibreNMS</text>
  <text class="d" x="76" y="206">SNMP device monitoring</text>

  <rect class="prom" x="310" y="164" width="180" height="56" rx="6"/>
  <text class="t" x="326" y="188">Prometheus</text>
  <text class="d" x="326" y="206">time-series metrics</text>

  <rect class="flow" x="560" y="164" width="200" height="56" rx="6"/>
  <text class="t" x="576" y="188">ntopng + syslog</text>
  <text class="d" x="576" y="206">flow and logs</text>

  <!-- grafana -->
  <line class="f" x1="150" y1="220" x2="330" y2="280"/>
  <line class="f" x1="400" y1="220" x2="400" y2="280"/>
  <line class="f" x1="650" y1="220" x2="470" y2="280"/>
  <rect class="graf" x="300" y="284" width="200" height="52" rx="6"/>
  <text class="t" x="316" y="308">Grafana</text>
  <text class="d" x="316" y="326">the NOC dashboards</text>

  <!-- alertmanager -->
  <line class="f" x1="490" y1="192" x2="600" y2="284"/>
  <rect class="alert" x="560" y="284" width="200" height="52" rx="6"/>
  <text class="t" x="576" y="308">Alertmanager</text>
  <text class="d" x="576" y="326">routes the alerts</text>

  <text class="sub" x="28" y="372">LibreNMS is what NOC job descriptions ask for. Prometheus and Grafana are where the industry is moving. Learning</text>
  <text class="sub" x="28" y="390">only one leaves half the job undone, so this builds both.</text>
</svg>
