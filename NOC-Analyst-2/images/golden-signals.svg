<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d">
  <title id="t">The four golden signals of monitoring</title>
  <desc id="d">Four signals cover most of what matters. Latency, how long it takes, measured as response time and round-trip time. Traffic, how much demand, measured as requests per second and bandwidth. Errors, how often it fails, measured as error rate and packet discards. Saturation, how full it is, measured as CPU, disk and link utilisation. A note says if you monitor only four things per service, monitor these.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .b1 { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.6; }
    .b2 { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.6; }
    .b3 { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
    .b4 { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.6; }
    .h1 { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11.5px; }
    .t  { fill: #1f2328; font-size: 14px; font-weight: 700; }
    .q  { fill: #424a53; font-size: 11px; font-style: italic; }
    .e  { fill: #424a53; font-size: 10.5px; }
    @media (prefers-color-scheme: dark) {
      .b1 { fill: #0c2d6b; stroke: #58a6ff; } .b2 { fill: #0f2f17; stroke: #3fb950; }
      .b3 { fill: #3c1618; stroke: #f85149; } .b4 { fill: #4a3808; stroke: #d29922; }
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; }
      .t  { fill: #e6edf3; } .q { fill: #b1bac4; } .e { fill: #b1bac4; }
    }
  </style>
  <text class="h1"  x="28" y="30">The four golden signals</text>
  <text class="sub" x="28" y="50">If you monitor only four things per service, monitor these.</text>

  <rect class="b1" x="40" y="72" width="330" height="106" rx="8"/>
  <text class="t" x="60" y="102">Latency</text>
  <text class="q" x="60" y="124">How long does it take?</text>
  <text class="e" x="60" y="148">Response time, round-trip time.</text>
  <text class="e" x="60" y="166">Slow is a problem before down is.</text>

  <rect class="b2" x="390" y="72" width="330" height="106" rx="8"/>
  <text class="t" x="410" y="102">Traffic</text>
  <text class="q" x="410" y="124">How much demand?</text>
  <text class="e" x="410" y="148">Requests per second, bandwidth.</text>
  <text class="e" x="410" y="166">Tells you the load.</text>

  <rect class="b3" x="40" y="192" width="330" height="106" rx="8"/>
  <text class="t" x="60" y="222">Errors</text>
  <text class="q" x="60" y="244">How often does it fail?</text>
  <text class="e" x="60" y="268">Error rate, packet discards.</text>
  <text class="e" x="60" y="286">The failures the user sees.</text>

  <rect class="b4" x="390" y="192" width="330" height="106" rx="8"/>
  <text class="t" x="410" y="222">Saturation</text>
  <text class="q" x="410" y="244">How full is it?</text>
  <text class="e" x="410" y="268">CPU, disk, link utilisation.</text>
  <text class="e" x="410" y="286">How close to the limit.</text>

  <text class="sub" x="28" y="324">A better starting point than a vendor's default template of two hundred metrics you will never look at.</text>
</svg>
