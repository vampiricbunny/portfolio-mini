<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-labelledby="t d">
  <title id="t">Microsoft Sentinel data architecture from source to analyst</title>
  <desc id="d">Four source groups feed a Log Analytics workspace. On-premises Proxmox hosts DC01, FS01 and two Windows 11 workstations are connected through Azure Arc and the Azure Monitor Agent, filtered by a data collection rule using nine XPath expressions. Microsoft 365 and Defender XDR connectors feed device, email and Office audit tables at no ingestion cost. Entra ID feeds sign-in and audit logs, which are charged. The OPNsense firewall feeds Syslog. The workspace holds the tables, Sentinel runs twelve analytics rules over them, incidents are created with entity mapping, and Logic App playbooks enrich and respond. A cost panel shows the custom data collection rule cutting volume from 7.2 gigabytes per day to 0.58, a 92 percent reduction.</desc>

