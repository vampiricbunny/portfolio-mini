<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" role="img" aria-labelledby="t d">
  <title id="t">Detection health workbook layout, drawn</title>
  <desc id="d">A drawn representation of the detection health workbook. A parameter bar holds time range, severity and rule filters. Tile one shows alert volume by rule as a bar list, with impossible travel highest. Tile two shows true and false positive rate per rule sorted by false positive rate descending, which is what decides the next tuning hour. Tile three lists rules that have gone quiet, showing consent grant with no fire in thirty days, and notes that a rule that never fires is either perfectly tuned or broken and the dashboard cannot tell you which. Tile four shows MITRE tactic coverage. Tile five shows ingestion cost by table with Security Event highest. A footer states this is a schematic illustration and not a screen capture.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .win    { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.4; }
    .bar    { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .tile   { fill: #fbfcfd; stroke: #d0d7de; stroke-width: 1.2; }
    .field  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .b1     { fill: #218bff; }
    .b2     { fill: #8250df; }
    .b3     { fill: #2ea043; }
    .bfp    { fill: #cf222e; }
    .btp    { fill: #2ea043; }
    .quiet  { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.2; }
    .hot    { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .h1     { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub    { fill: #656d76; font-size: 11.5px; }
    .tt     { fill: #1f2328; font-size: 11.5px; font-weight: 600; }
    .lbl    { fill: #424a53; font-size: 9.5px; }
    .val    { fill: #1f2328; font-size: 9.5px; font-weight: 600; }
    .dim    { fill: #656d76; font-size: 9.5px; }
    .note   { fill: #9a6700; font-size: 10px; }
    .foot   { fill: #656d76; font-size: 10.5px; font-style: italic; }
    .mono   { fill: #0550ae; font-size: 9.5px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

    @media (prefers-color-scheme: dark) {
      .win    { fill: #0d1117; stroke: #30363d; }
      .bar    { fill: #161b22; stroke: #30363d; }
      .tile   { fill: #11161d; stroke: #30363d; }
      .field  { fill: #0d1117; stroke: #30363d; }
      .b1     { fill: #58a6ff; }
      .b2     { fill: #bc8cff; }
      .b3     { fill: #3fb950; }
      .bfp    { fill: #f85149; }
      .btp    { fill: #3fb950; }
      .quiet  { fill: #4a3808; stroke: #d29922; }
      .hot    { fill: #3c1618; stroke: #f85149; }
      .h1     { fill: #e6edf3; }
      .sub    { fill: #8b949e; }
      .tt     { fill: #e6edf3; }
      .lbl    { fill: #b1bac4; }
      .val    { fill: #e6edf3; }
      .dim    { fill: #8b949e; }
      .note   { fill: #d29922; }
      .foot   { fill: #8b949e; }
      .mono   { fill: #79c0ff; }
    }
  </style>

  <text class="h1"  x="24" y="28">Detection Health workbook</text>
  <text class="sub" x="24" y="48">Reviewed weekly. Drives the tuning session. One change a week, not ten.</text>

  <rect class="win" x="24" y="64" width="892" height="500" rx="6"/>

  <!-- parameter bar -->
  <rect class="bar" x="24" y="64" width="892" height="38" rx="6"/>
  <rect class="field" x="40" y="74" width="110" height="20" rx="3"/>
  <text class="dim" x="47" y="88">Last 30 days</text>
  <rect class="field" x="158" y="74" width="96" height="20" rx="3"/>
  <text class="dim" x="165" y="88">Severity: All</text>
  <rect class="field" x="262" y="74" width="110" height="20" rx="3"/>
  <text class="dim" x="269" y="88">Rule: All</text>
  <text class="dim" x="686" y="88">Parameters make one workbook, not four</text>

  <!-- tile 1: alert volume -->
  <rect class="tile" x="40" y="114" width="280" height="196" rx="5"/>
  <text class="tt" x="54" y="136">1.  Alert volume by rule</text>

  <text class="lbl" x="54" y="160">SEN-003 Impossible travel</text>
  <rect class="b1" x="54" y="164" width="180" height="9" rx="2"/>
  <text class="val" x="242" y="172">32</text>

  <text class="lbl" x="54" y="192">SEN-012 Rare process</text>
  <rect class="b1" x="54" y="196" width="150" height="9" rx="2"/>
  <text class="val" x="242" y="204">27</text>

  <text class="lbl" x="54" y="224">SEN-009 Legacy auth</text>
  <rect class="b1" x="54" y="228" width="72" height="9" rx="2"/>
  <text class="val" x="242" y="236">13</text>

  <text class="lbl" x="54" y="256">SEN-002 Password spray</text>
  <rect class="b1" x="54" y="260" width="34" height="9" rx="2"/>
  <text class="val" x="242" y="268">6</text>

  <text class="lbl" x="54" y="288">SEN-001 Office spawns shell</text>
  <rect class="b1" x="54" y="292" width="17" height="9" rx="2"/>
  <text class="val" x="242" y="300">3</text>

  <!-- tile 2: TP/FP rate -->
  <rect class="tile" x="332" y="114" width="300" height="196" rx="5"/>
  <text class="tt" x="346" y="136">2.  False positive rate, sorted</text>

  <text class="lbl" x="346" y="160">SEN-003  Impossible travel</text>
  <rect class="bfp" x="346" y="164" width="150" height="9" rx="2"/>
  <rect class="btp" x="496" y="164" width="50" height="9" rx="2"/>
  <text class="val" x="556" y="172">75% FP</text>

  <text class="lbl" x="346" y="192">SEN-009  Legacy auth</text>
  <rect class="bfp" x="346" y="196" width="80" height="9" rx="2"/>
  <rect class="btp" x="426" y="196" width="120" height="9" rx="2"/>
  <text class="val" x="556" y="204">40% FP</text>

  <text class="lbl" x="346" y="224">SEN-006  Privileged role</text>
  <rect class="bfp" x="346" y="228" width="40" height="9" rx="2"/>
  <rect class="btp" x="386" y="228" width="160" height="9" rx="2"/>
  <text class="val" x="556" y="236">20% FP</text>

  <text class="lbl" x="346" y="256">SEN-001  Office spawns shell</text>
  <rect class="btp" x="346" y="260" width="200" height="9" rx="2"/>
  <text class="val" x="556" y="268">0% FP</text>

  <rect class="hot" x="346" y="280" width="272" height="20" rx="3"/>
  <text class="note" x="354" y="294">Top of this list is where the next tuning hour goes</text>

  <!-- tile 3: quiet rules -->
  <rect class="tile" x="644" y="114" width="256" height="196" rx="5"/>
  <text class="tt" x="658" y="136">3.  Rules that have gone quiet</text>

  <text class="mono" x="658" y="162">SEN-007</text>
  <text class="lbl"  x="722" y="162">Consent grant</text>
  <text class="val"  x="836" y="162">30 d</text>

  <text class="mono" x="658" y="186">SEN-004</text>
  <text class="lbl"  x="722" y="186">LSASS access</text>
  <text class="val"  x="836" y="186">18 d</text>

  <text class="mono" x="658" y="210">SEN-005</text>
  <text class="lbl"  x="722" y="210">Forwarding rule</text>
  <text class="val"  x="836" y="210">9 d</text>

  <rect class="quiet" x="658" y="228" width="228" height="66" rx="3"/>
  <text class="note" x="666" y="248">A rule that never fires is either</text>
  <text class="note" x="666" y="264">perfectly tuned or broken, and the</text>
  <text class="note" x="666" y="280">dashboard cannot tell you which.</text>

  <!-- tile 4: coverage -->
  <rect class="tile" x="40" y="322" width="420" height="222" rx="5"/>
  <text class="tt" x="54" y="344">4.  Coverage by MITRE tactic</text>

  <text class="lbl" x="54" y="370">Credential Access</text>
  <rect class="b2" x="180" y="362" width="190" height="11" rx="2"/>
  <text class="val" x="382" y="372">3 rules</text>

  <text class="lbl" x="54" y="400">Defense Evasion</text>
  <rect class="b2" x="180" y="392" width="126" height="11" rx="2"/>
  <text class="val" x="382" y="402">2 rules</text>

  <text class="lbl" x="54" y="430">Initial Access</text>
  <rect class="b2" x="180" y="422" width="126" height="11" rx="2"/>
  <text class="val" x="382" y="432">2 rules</text>

  <text class="lbl" x="54" y="460">Persistence</text>
  <rect class="b2" x="180" y="452" width="63" height="11" rx="2"/>
  <text class="val" x="382" y="462">1 rule</text>

  <text class="lbl" x="54" y="490">Privilege Escalation</text>
  <rect class="b2" x="180" y="482" width="63" height="11" rx="2"/>
  <text class="val" x="382" y="492">1 rule</text>

  <text class="lbl" x="54" y="520">Discovery</text>
  <text class="note" x="180" y="520">no coverage, documented gap</text>

  <!-- tile 5: cost -->
  <rect class="tile" x="472" y="322" width="428" height="222" rx="5"/>
  <text class="tt" x="486" y="344">5.  Ingestion cost by table</text>

  <text class="lbl" x="486" y="370">SecurityEvent</text>
  <rect class="b3" x="620" y="362" width="190" height="11" rx="2"/>
  <text class="val" x="822" y="372">3.10 USD</text>

  <text class="lbl" x="486" y="400">SigninLogs</text>
  <rect class="b3" x="620" y="392" width="88" height="11" rx="2"/>
  <text class="val" x="822" y="402">1.42 USD</text>

  <text class="lbl" x="486" y="430">Syslog</text>
  <rect class="b3" x="620" y="422" width="18" height="11" rx="2"/>
  <text class="val" x="822" y="432">0.28 USD</text>

  <text class="lbl" x="486" y="460">DeviceProcessEvents</text>
  <text class="val" x="822" y="460">free</text>

  <text class="lbl" x="486" y="484">EmailEvents, OfficeActivity</text>
  <text class="val" x="822" y="484">free</text>

  <rect class="quiet" x="486" y="496" width="400" height="40" rx="3"/>
  <text class="note" x="494" y="514">Cost lives here, not in the management workbook.</text>
  <text class="note" x="494" y="530">The person tuning rules is the person who can reduce it.</text>

  <text class="foot" x="24" y="588">Schematic illustration of the workbook layout, not a screen capture.</text>
  <text class="sub"  x="24" y="608">Tile 4 is self-reported coverage: it counts rules that exist, not techniques actually detectable. Only scheduled attack simulation fixes that.</text>
</svg>
