<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d">
  <title id="t">Microsoft Sentinel incidents view, drawn layout with numbered callouts</title>
  <desc id="d">A drawn representation of the Sentinel incidents blade. On the left a navigation rail lists Overview, Incidents, Workbooks, Hunting, Notebooks, Entity behavior, Threat intelligence, Analytics, Automation and Data connectors. Callout one marks the filter bar with severity, status and owner filters. Callout two marks the incident grid listing severity, incident number, title, alert count, entity count and last update. Callout three marks the detail pane. Callout four marks the entities list of accounts, hosts and IP addresses. Callout five marks the alert timeline. Callout six marks the Investigate button that opens the graph. Callout seven marks comments and activity log. Callout eight marks the tasks checklist. A footer states this is a schematic illustration and not a screen capture.</desc>

