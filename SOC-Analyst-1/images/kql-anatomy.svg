<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a KQL query, annotated</title>
  <desc id="d">A six line KQL query with each line annotated. Line one names the table SecurityEvent. Line two filters on TimeGenerated first because it is the partition key and the only filter that lets the engine skip reading data. Line three filters on EventID. Line four summarizes a count grouped by account. Line five filters the aggregated result. Line six sorts. A note explains that data flows left to right and each operator only sees what the one before it passed on, and that filtering on TimeGenerated in first position took one test query from forty seconds to two.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .code   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
    .hl     { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.4; }
    .pipe   { stroke: #8250df; stroke-width: 2; }
    .lead   { stroke: #afb8c1; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .panel  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.3; }
    .h1     { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub    { fill: #656d76; font-size: 11.5px; }
    .kw     { fill: #cf222e; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .tbln   { fill: #8250df; font-size: 13px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .op     { fill: #0550ae; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .txt    { fill: #1f2328; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .num    { fill: #0969da; font-size: 11px; font-weight: 700; }
    .note   { fill: #424a53; font-size: 11px; }
    .strong { fill: #1f2328; font-size: 11px; font-weight: 600; }
    .ptx    { fill: #0550ae; font-size: 11px; }
    .ptitle { fill: #1f2328; font-size: 11.5px; font-weight: 600; }

    @media (prefers-color-scheme: dark) {
      .code   { fill: #0d1117; stroke: #30363d; }
      .hl     { fill: #4a3808; stroke: #d29922; }
      .pipe   { stroke: #bc8cff; }
      .lead   { stroke: #484f58; }
      .panel  { fill: #0c2d6b; stroke: #58a6ff; }
      .h1     { fill: #e6edf3; }
      .sub    { fill: #8b949e; }
      .kw     { fill: #ff7b72; }
      .tbln   { fill: #d2a8ff; }
      .op     { fill: #79c0ff; }
      .txt    { fill: #e6edf3; }
      .num    { fill: #58a6ff; }
      .note   { fill: #b1bac4; }
      .strong { fill: #e6edf3; }
      .ptx    { fill: #79c0ff; }
      .ptitle { fill: #e6edf3; }
    }
  </style>

  <text class="h1"  x="24" y="28">Anatomy of a KQL query</text>
  <text class="sub" x="24" y="48">Data flows top to bottom. Each operator only ever sees what the one before it passed on.</text>

  <rect class="code" x="24" y="66" width="480" height="242" rx="6"/>
  <line class="pipe" x1="40" y1="96" x2="40" y2="286"/>

  <!-- line 1 -->
  <text class="num"  x="30" y="92">1</text>
  <text class="tbln" x="56" y="94">SecurityEvent</text>

  <!-- line 2 -->
  <rect class="hl" x="50" y="106" width="440" height="24" rx="4"/>
  <text class="num" x="30" y="124">2</text>
  <text class="op"  x="56" y="124">| where</text>
  <text class="txt" x="120" y="124">TimeGenerated &gt; ago(24h)</text>

  <!-- line 3 -->
  <text class="num" x="30" y="156">3</text>
  <text class="op"  x="56" y="156">| where</text>
  <text class="txt" x="120" y="156">EventID == 4625</text>

  <!-- line 4 -->
  <text class="num" x="30" y="188">4</text>
  <text class="op"  x="56" y="188">| summarize</text>
  <text class="txt" x="152" y="188">Failures = count()</text>
  <text class="kw"  x="302" y="188">by</text>
  <text class="txt" x="328" y="188">Account</text>

  <!-- line 5 -->
  <text class="num" x="30" y="220">5</text>
  <text class="op"  x="56" y="220">| where</text>
  <text class="txt" x="120" y="220">Failures &gt; 10</text>

  <!-- line 6 -->
  <text class="num" x="30" y="252">6</text>
  <text class="op"  x="56" y="252">| order by</text>
  <text class="txt" x="144" y="252">Failures desc</text>

  <!-- line 7 -->
  <text class="num" x="30" y="284">7</text>
  <text class="op"  x="56" y="284">| take</text>
  <text class="txt" x="112" y="284">20</text>

  <!-- annotations -->
  <line class="lead" x1="504" y1="90"  x2="560" y2="90"/>
  <text class="strong" x="566" y="86">The table</text>
  <text class="note"   x="566" y="102">Everything starts here</text>

  <line class="lead" x1="504" y1="120" x2="560" y2="120"/>
  <text class="strong" x="566" y="116">Time filter, always first</text>
  <text class="note"   x="566" y="132">TimeGenerated is the partition key. It is</text>
  <text class="note"   x="566" y="147">the only filter that lets the engine skip</text>
  <text class="note"   x="566" y="162">reading data at all.</text>

  <line class="lead" x1="504" y1="152" x2="560" y2="180"/>
  <text class="strong" x="566" y="192">Then narrow the rows</text>
  <text class="note"   x="566" y="208">Use has over contains where you can.</text>

  <line class="lead" x1="504" y1="184" x2="560" y2="238"/>
  <text class="strong" x="566" y="250">Then aggregate</text>
  <text class="note"   x="566" y="266">by is the grouping. dcount here instead</text>
  <text class="note"   x="566" y="281">of count is what detects a spray.</text>

  <line class="lead" x1="504" y1="216" x2="560" y2="308"/>
  <text class="strong" x="566" y="320">Filter the result, not the rows</text>
  <text class="note"   x="566" y="336">This where sees only what summarize</text>
  <text class="note"   x="566" y="351">produced, so Failures exists here.</text>

  <line class="lead" x1="504" y1="280" x2="560" y2="378"/>
  <text class="strong" x="566" y="390">take is not top</text>
  <text class="note"   x="566" y="406">take returns any 20 rows. Use</text>
  <text class="note"   x="566" y="421">top 20 by Failures desc when you</text>
  <text class="note"   x="566" y="436">mean the highest 20.</text>

  <!-- speed panel -->
  <rect class="panel" x="24" y="324" width="480" height="92" rx="6"/>
  <text class="ptitle" x="40" y="348">Order matters for speed, not just for logic</text>
  <text class="ptx" x="40" y="370">Same query, where TimeGenerated moved from third position</text>
  <text class="ptx" x="40" y="388">to first:</text>
  <text class="ptx" x="40" y="408">40 seconds  becomes  2 seconds</text>
</svg>
