<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="t d">
  <title id="t">The phases of a penetration test, and what each produces</title>
  <desc id="d">Six phases in order. Planning produces the scope and authorisation. Reconnaissance produces live hosts and open ports. Enumeration produces users, shares and attack surface. Exploitation produces a foothold and credentials. Post-exploitation produces privilege escalation and lateral movement. Reporting produces findings, evidence and remediation. Phases three, four and five form a loop, because every new credential opens enumeration that was not possible before. A note states that enumeration is where engagements are won.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box   { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.5; }
    .loop  { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.8; }
    .rep   { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.5; }
    .flow  { stroke: #656d76; stroke-width: 1.8; marker-end: url(#a); fill: none; }
    .lp    { stroke: #d4a72c; stroke-width: 2; marker-end: url(#y); fill: none; stroke-dasharray: 5 3; }
    .arrow { fill: #656d76; }
    .ay    { fill: #d4a72c; }
    .h1    { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub   { fill: #656d76; font-size: 11.5px; }
    .num   { fill: #0550ae; font-size: 12px; font-weight: 700; }
    .ph    { fill: #1f2328; font-size: 12.5px; font-weight: 700; }
    .out   { fill: #424a53; font-size: 10px; }
    .lt    { fill: #9a6700; font-size: 11px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box   { fill: #0c2d6b; stroke: #58a6ff; }
      .loop  { fill: #4a3808; stroke: #d29922; }
      .rep   { fill: #0f2f17; stroke: #3fb950; }
      .flow  { stroke: #8b949e; }
      .lp    { stroke: #d29922; }
      .arrow { fill: #8b949e; }
      .ay    { fill: #d29922; }
      .h1    { fill: #e6edf3; }
      .sub   { fill: #8b949e; }
      .num   { fill: #79c0ff; }
      .ph    { fill: #e6edf3; }
      .out   { fill: #b1bac4; }
      .lt    { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="ay"/></marker>
  </defs>
  <text class="h1"  x="28" y="32">Engagement phases</text>
  <text class="sub" x="28" y="54">Worked in order, with a loop through the middle three.</text>

  <rect class="box" x="28" y="80" width="240" height="70" rx="7"/>
  <text class="num" x="44" y="104">1</text>
  <text class="ph"  x="64" y="104">Planning</text>
  <text class="out" x="44" y="126">Scope, rules of engagement,</text>
  <text class="out" x="44" y="142">authorisation</text>

  <rect class="box" x="292" y="80" width="240" height="70" rx="7"/>
  <text class="num" x="308" y="104">2</text>
  <text class="ph"  x="328" y="104">Reconnaissance</text>
  <text class="out" x="308" y="126">Live hosts, open ports,</text>
  <text class="out" x="308" y="142">running services</text>

  <line class="flow" x1="268" y1="115" x2="290" y2="115"/>

  <!-- loop trio -->
  <rect class="loop" x="292" y="180" width="240" height="66" rx="7"/>
  <text class="num" x="308" y="204">3</text>
  <text class="ph"  x="328" y="204">Enumeration</text>
  <text class="out" x="308" y="226">Users, shares, configs,</text>
  <text class="out" x="308" y="240">attack surface</text>

  <rect class="loop" x="292" y="270" width="240" height="66" rx="7"/>
  <text class="num" x="308" y="294">4</text>
  <text class="ph"  x="328" y="294">Exploitation</text>
  <text class="out" x="308" y="316">A foothold, then</text>
  <text class="out" x="308" y="330">credentials</text>

  <rect class="loop" x="556" y="225" width="240" height="66" rx="7"/>
  <text class="num" x="572" y="249">5</text>
  <text class="ph"  x="592" y="249">Post-exploitation</text>
  <text class="out" x="572" y="271">Privilege escalation,</text>
  <text class="out" x="572" y="285">lateral movement</text>

  <line class="flow" x1="412" y1="150" x2="412" y2="178"/>
  <line class="lp" x1="412" y1="246" x2="412" y2="268"/>
  <line class="lp" x1="532" y1="300" x2="556" y2="270"/>
  <!-- loop back arrow from post-exploit to enumeration -->
  <path class="lp" d="M 676 225 C 676 130, 560 150, 534 195" fill="none"/>
  <text class="lt" x="596" y="150">new access opens</text>
  <text class="lt" x="596" y="166">new enumeration</text>

  <rect class="rep" x="292" y="356" width="240" height="34" rx="7"/>
  <text class="num" x="308" y="378">6</text>
  <text class="ph"  x="328" y="378">Reporting</text>
  <text class="out" x="432" y="378">findings, remediation</text>
  <line class="flow" x1="412" y1="336" x2="412" y2="354"/>

  <text class="lt" x="44" y="290">Enumeration is where</text>
  <text class="lt" x="44" y="308">engagements are won,</text>
  <text class="lt" x="44" y="326">not exploitation.</text>
</svg>
