<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" role="img" aria-labelledby="t d">
  <title id="t">VBunny Lab virtual network topology</title>
  <desc id="d">Three virtual machines on a VMware host-only network numbered 10.10.10.0/24: DC01 running Windows Server 2025 with AD DS, DNS and DHCP at 10.10.10.10; FILE01 running Windows Server 2022 as a file server at 10.10.10.20; and WS11-01, a Windows 11 Pro client receiving its address by DHCP. A side panel notes the addressing plan and why host-only networking is used.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .host   { fill: none; stroke: #afb8c1; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .dc     { fill: #ecd8ff; stroke: #8250df; stroke-width: 1.6; }
    .srv    { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.6; }
    .cli    { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.6; }
    .panel  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .spine  { stroke: #656d76; stroke-width: 2.5; }
    .drop   { stroke: #8c959f; stroke-width: 1.4; }
    .name   { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .os     { fill: #424a53; font-size: 11.5px; }
    .role   { fill: #424a53; font-size: 11.5px; }
    .ip     { fill: #0550ae; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .net    { fill: #1f2328; font-size: 12.5px; font-weight: 600; }
    .meta   { fill: #656d76; font-size: 11px; }
    .ptitle { fill: #1f2328; font-size: 12px; font-weight: 600; }
    .pbody  { fill: #424a53; font-size: 11.5px; }

    @media (prefers-color-scheme: dark) {
      .host   { stroke: #484f58; }
      .dc     { fill: #3c1e70; stroke: #bc8cff; }
      .srv    { fill: #0c2d6b; stroke: #58a6ff; }
      .cli    { fill: #0f2f17; stroke: #3fb950; }
      .panel  { fill: #0d1117; stroke: #30363d; }
      .spine  { stroke: #8b949e; }
      .drop   { stroke: #6e7681; }
      .name   { fill: #e6edf3; }
      .os     { fill: #b1bac4; }
      .role   { fill: #b1bac4; }
      .ip     { fill: #79c0ff; }
      .net    { fill: #e6edf3; }
      .meta   { fill: #8b949e; }
      .ptitle { fill: #e6edf3; }
      .pbody  { fill: #b1bac4; }
    }
  </style>

  <text class="name" x="40" y="34">VBunny Lab - virtual topology</text>
  <text class="meta" x="40" y="54">VMware Workstation, host-only networking. No route to the physical LAN.</text>

  <!-- host boundary -->
  <rect class="host" x="40" y="72" width="530" height="340" rx="10"/>

  <!-- DC01 -->
  <rect class="dc" x="70" y="98" width="212" height="104" rx="7"/>
  <text class="name" x="88" y="124">DC01</text>
  <text class="os"   x="88" y="143">Windows Server 2025</text>
  <text class="role" x="88" y="161">AD DS · DNS · DHCP</text>
  <text class="ip"   x="88" y="183">10.10.10.10</text>
  <line class="drop" x1="176" y1="202" x2="176" y2="248"/>

  <!-- FILE01 -->
  <rect class="srv" x="322" y="98" width="212" height="104" rx="7"/>
  <text class="name" x="340" y="124">FILE01</text>
  <text class="os"   x="340" y="143">Windows Server 2022</text>
  <text class="role" x="340" y="161">File services · shares</text>
  <text class="ip"   x="340" y="183">10.10.10.20</text>
  <line class="drop" x1="428" y1="202" x2="428" y2="248"/>

  <!-- network spine -->
  <line class="spine" x1="80" y1="248" x2="530" y2="248"/>
  <text class="net" x="80" y="232">Host-Only  ·  VMnet1</text>
  <text class="ip"  x="230" y="232">10.10.10.0/24</text>
  <text class="meta" x="350" y="232">gateway 10.10.10.1</text>

  <!-- WS11-01 -->
  <line class="drop" x1="300" y1="248" x2="300" y2="294"/>
  <rect class="cli" x="194" y="294" width="212" height="100" rx="7"/>
  <text class="name" x="212" y="320">WS11-01</text>
  <text class="os"   x="212" y="339">Windows 11 Pro</text>
  <text class="role" x="212" y="357">Domain-joined client</text>
  <text class="ip"   x="212" y="379">DHCP · .50-.200</text>

  <!-- panel -->
  <rect class="panel" x="600" y="72" width="152" height="340" rx="8"/>

  <text class="ptitle" x="618" y="100">Addressing</text>
  <text class="pbody"  x="618" y="122">.1   gateway</text>
  <text class="pbody"  x="618" y="140">.10  DC01</text>
  <text class="pbody"  x="618" y="158">.20  FILE01</text>
  <text class="pbody"  x="618" y="176">.50+ DHCP pool</text>

  <text class="ptitle" x="618" y="212">Why host-only</text>
  <text class="pbody"  x="618" y="234">Keeps a second</text>
  <text class="pbody"  x="618" y="251">DHCP server off</text>
  <text class="pbody"  x="618" y="268">the home LAN,</text>
  <text class="pbody"  x="618" y="285">where it would</text>
  <text class="pbody"  x="618" y="302">fight the router.</text>

  <text class="ptitle" x="618" y="338">DNS rule</text>
  <text class="pbody"  x="618" y="360">Members point</text>
  <text class="pbody"  x="618" y="377">at DC01 only.</text>
  <text class="pbody"  x="618" y="394">Never 8.8.8.8.</text>
</svg>
