<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-labelledby="t d">
  <title id="t">The beacon interaction console, a Kali terminal</title>
  <desc id="d">A Kali Linux terminal interacting with a beacon session. The operator runs quiet reconnaissance commands inside the session: who am i, the current privileges, the running processes, and the domain. Each command is spaced out to respect the sleep interval. A note on the right points out that these are built-in living-off-the-land commands that drop no files, and that behavioural detection still catches the pattern.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .term { fill: #0c0c14; stroke: #30363d; stroke-width: 1.3; }
    .bar  { fill: #1a1a2e; }
    .sess { fill: #d2a8ff; font-size: 11.5px; }
    .cmd  { fill: #e6edf3; font-size: 11.5px; }
    .out  { fill: #c9d1d9; font-size: 11px; }
    .hi   { fill: #ffa657; font-size: 11px; font-weight: 700; }
    .dim  { fill: #8b949e; font-size: 11px; }
    .cnum{ fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .cc  { fill: #cf222e; stroke: #ffffff; stroke-width: 1.2; }
    .clbl{ fill: #a40e26; font-size: 10.5px; font-weight: 700; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } .clbl { fill: #ff7b72; } }
  </style>
  <text class="h1"  x="20" y="26">Beacon interaction (Kali terminal)</text>
  <text class="sub" x="20" y="44">Quiet reconnaissance inside the session, spaced to respect the sleep.</text>

  <rect class="term" x="20" y="58" width="600" height="414" rx="7"/>
  <rect class="bar"  x="20" y="58" width="600" height="26" rx="7"/>
  <circle cx="36" cy="71" r="4.5" fill="#ff5f56"/>
  <circle cx="52" cy="71" r="4.5" fill="#ffbd2e"/>
  <circle cx="68" cy="71" r="4.5" fill="#27c93f"/>
  <text class="mono dim" x="290" y="75">session a1f3  WS-FIN01</text>

  <text class="mono sess" x="34" y="108">[a1f3] &gt; <tspan class="cmd">whoami</tspan></text>
  <text class="mono out"  x="34" y="128">vbunnylab\jdoe</text>

  <text class="mono sess" x="34" y="156">[a1f3] &gt; <tspan class="cmd">whoami /priv</tspan></text>
  <text class="mono out"  x="34" y="176">SeChangeNotifyPrivilege        Enabled</text>
  <text class="mono dim"  x="34" y="194">standard user, no admin yet</text>

  <text class="mono sess" x="34" y="222">[a1f3] &gt; <tspan class="cmd">ps | findstr /i av edr</tspan></text>
  <text class="mono hi"   x="34" y="242">MsMpEng.exe   Defender present</text>
  <text class="mono dim"  x="34" y="260">know the defence before you move</text>

  <text class="mono sess" x="34" y="288">[a1f3] &gt; <tspan class="cmd">nltest /dclist:vbunnylab</tspan></text>
  <text class="mono out"  x="34" y="308">DC01.vbunnylab.local</text>

  <text class="mono sess" x="34" y="336">[a1f3] &gt; <tspan class="cmd">sleep 3600 37</tspan></text>
  <text class="mono dim"  x="34" y="356">[*] Sleeping one hour before the next move.</text>
  <text class="mono dim"  x="34" y="374">[*] No rush. Noise is what gets you caught.</text>
  <text class="mono sess" x="34" y="402">[a1f3] &gt; <tspan class="cmd">_</tspan></text>

  <!-- callouts -->
  <circle class="cc" cx="300" cy="222" r="11"/><text class="cnum" x="300" y="226">1</text>
  <circle class="cc" cx="150" cy="336" r="11"/><text class="cnum" x="150" y="340">2</text>

  <text class="clbl" x="636" y="150">Built-in commands,</text>
  <text class="clbl" x="636" y="166">living off the land.</text>
  <text class="clbl" x="636" y="182">They drop no files,</text>
  <text class="clbl" x="636" y="198">so a signature scan</text>
  <text class="clbl" x="636" y="214">sees nothing.</text>

  <text class="clbl" x="636" y="248">1  But behavioural</text>
  <text class="clbl" x="636" y="264">detection catches</text>
  <text class="clbl" x="636" y="280">the recon pattern.</text>

  <text class="clbl" x="636" y="330">2  Long sleeps</text>
  <text class="clbl" x="636" y="346">between actions</text>
  <text class="clbl" x="636" y="362">keep volume low.</text>

  <text class="foot" x="20" y="494"> These are standard enumeration commands, nothing weaponised.</text>
</svg>
