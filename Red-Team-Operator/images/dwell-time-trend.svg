<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-labelledby="t d">
  <title id="t">Dwell time falling across exercises</title>
  <desc id="d">A line chart over four red team exercises. The dwell time, how long the adversary went undetected, falls from about five days to about one day. A note says a good red team always gets in, so the measure is not whether, but how fast the defence detects, and that is improving.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11.5px; }
    .axis{ stroke: #8c959f; stroke-width: 1.4; }
    .grid{ stroke: #e1e4e8; stroke-width: 1; }
    .dwell{ stroke: #cf222e; stroke-width: 2.8; fill: none; }
    .area{ fill: #fdeef0; opacity: 0.6; }
    .dot{ fill: #cf222e; }
    .lbl{ fill: #57606a; font-size: 10.5px; text-anchor: middle; }
    .vl { fill: #57606a; font-size: 10px; font-weight: 700; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; }
      .grid { stroke: #30363d; } .axis { stroke: #6e7681; } .lbl { fill: #8b949e; } .vl { fill: #8b949e; } .area { fill: #3d1417; opacity: 0.5; }
    }
  </style>
  <text class="h1"  x="24" y="30">Dwell time, falling exercise by exercise</text>
  <text class="sub" x="24" y="49">A good red team always gets in. The measure is how fast the defence notices.</text>

  <line class="grid" x1="90" y1="90"  x2="760" y2="90"/>
  <line class="grid" x1="90" y1="140" x2="760" y2="140"/>
  <line class="grid" x1="90" y1="190" x2="760" y2="190"/>
  <line class="grid" x1="90" y1="240" x2="760" y2="240"/>
  <line class="axis" x1="90" y1="70" x2="90" y2="280"/>
  <line class="axis" x1="90" y1="280" x2="760" y2="280"/>

  <text class="lbl" x="56" y="94" text-anchor="end">6d</text>
  <text class="lbl" x="56" y="144" text-anchor="end">4d</text>
  <text class="lbl" x="56" y="194" text-anchor="end">2d</text>
  <text class="lbl" x="56" y="282" text-anchor="end">0</text>

  <text class="lbl" x="170" y="300">Ex 1</text>
  <text class="lbl" x="350" y="300">Ex 2</text>
  <text class="lbl" x="530" y="300">Ex 3</text>
  <text class="lbl" x="700" y="300">Ex 4</text>

  <!-- dwell: Ex1 5d(y~115) Ex2 3.5d(y~152) Ex3 2.3d(y~183) Ex4 1d(y~230) -->
  <polygon class="area" points="170,115 350,152 530,183 700,230 700,280 170,280"/>
  <polyline class="dwell" points="170,115 350,152 530,183 700,230"/>
  <circle class="dot" cx="170" cy="115" r="4.5"/><text class="vl" x="150" y="107">5d</text>
  <circle class="dot" cx="350" cy="152" r="4.5"/><text class="vl" x="332" y="144">3.5d</text>
  <circle class="dot" cx="530" cy="183" r="4.5"/><text class="vl" x="512" y="175">2.3d</text>
  <circle class="dot" cx="700" cy="230" r="4.5"/><text class="vl" x="686" y="222">1d</text>

  <text class="foot" x="24" y="330">Each exercise fed detections back into the SOC. Five days of blindness became one. That falling line is the whole point of a red team program.</text>
</svg>
