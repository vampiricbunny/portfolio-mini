<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="t d">
  <title id="t">The phishing campaign console</title>
  <desc id="d">A phishing framework dashboard for the simulated campaign against lab identities. Stat tiles show emails sent, opened, links clicked, and credentials submitted. A funnel below shows the drop-off at each stage. A banner notes the targets were the operator's own lab accounts.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .app { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .bar { fill: #2b3a55; }
    .tile{ fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .appt{ fill: #ffffff; font-size: 12px; font-weight: 700; }
    .tl { fill: #57606a; font-size: 10.5px; }
    .big{ fill: #1f2328; font-size: 26px; font-weight: 700; }
    .fun{ fill: #cf4b5e; }
    .funt{ fill: #ffffff; font-size: 11px; font-weight: 700; }
    .ban{ fill: #fff4e5; stroke: #e16f24; stroke-width: 1.3; }
    .bant{ fill: #9a5700; font-size: 10.5px; font-weight: 700; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; }
      .app { fill: #0d1117; stroke: #30363d; } .tile { fill: #161b22; stroke: #30363d; }
      .tl { fill: #8b949e; } .big { fill: #e6edf3; } .ban { fill: #3a1e0d; stroke: #e16f24; } .bant { fill: #f0a868; }
    }
  </style>
  <text class="h1"  x="20" y="26">Phishing campaign, initial access</text>
  <text class="sub" x="20" y="44">Against the operator's own lab identities, tracked in a phishing framework.</text>

  <rect class="app" x="20" y="58" width="780" height="356" rx="6"/>
  <rect class="bar" x="20" y="58" width="780" height="28" rx="6"/>
  <text class="appt" x="36" y="77">Phishing framework  &gt;  Campaign: Invoice-Lure</text>

  <!-- banner -->
  <rect class="ban" x="36" y="100" width="748" height="30" rx="5"/>
  <text class="bant" x="50" y="120">Targets are lab accounts owned by the operator. No real person was phished.</text>

  <!-- stat tiles -->
  <rect class="tile" x="36"  y="146" width="180" height="90" rx="6"/>
  <text class="tl" x="52" y="170">Emails sent</text><text class="big" x="52" y="208">8</text>
  <rect class="tile" x="232" y="146" width="180" height="90" rx="6"/>
  <text class="tl" x="248" y="170">Opened</text><text class="big" x="248" y="208">6</text>
  <rect class="tile" x="428" y="146" width="180" height="90" rx="6"/>
  <text class="tl" x="444" y="170">Clicked link</text><text class="big" x="444" y="208">4</text>
  <rect class="tile" x="624" y="146" width="160" height="90" rx="6"/>
  <text class="tl" x="640" y="170">Submitted creds</text><text class="big" x="640" y="208">2</text>

  <!-- funnel -->
  <text class="tl" x="36" y="272" font-weight="700">Funnel</text>
  <rect class="fun" x="36" y="282" width="748" height="26" rx="4" opacity="0.95"/><text class="funt" x="48" y="300">Sent  8</text>
  <rect class="fun" x="36" y="314" width="560" height="26" rx="4" opacity="0.8"/><text class="funt" x="48" y="332">Opened  6</text>
  <rect class="fun" x="36" y="346" width="374" height="26" rx="4" opacity="0.65"/><text class="funt" x="48" y="364">Clicked  4</text>
  <rect class="fun" x="36" y="378" width="186" height="22" rx="4" opacity="0.5"/><text class="funt" x="48" y="394">Submitted  2</text>

  <text class="foot" x="20" y="430"> One credential submission was enough for the foothold.</text>
</svg>
