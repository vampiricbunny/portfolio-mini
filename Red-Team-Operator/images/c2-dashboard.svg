<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-labelledby="t d">
  <title id="t">The C2 operator console, a Kali terminal</title>
  <desc id="d">A Kali Linux terminal window running an open-source command-and-control client. The two-line Kali zsh prompt is shown. The operator lists active sessions, showing two beacons from compromised lab hosts with their user, hostname, last check-in and a long sleep interval. The operator then selects one session to interact with. Numbered callouts point to the long low-and-slow sleep, and the session selection.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .term { fill: #0c0c14; stroke: #30363d; stroke-width: 1.3; }
    .bar  { fill: #1a1a2e; }
    .p1   { fill: #5fd7ff; font-size: 11.5px; }
    .p2   { fill: #ff5faf; font-size: 11.5px; }
    .cmd  { fill: #e6edf3; font-size: 11.5px; }
    .hdr  { fill: #7ee787; font-size: 11.5px; font-weight: 700; }
    .out  { fill: #c9d1d9; font-size: 11px; }
    .hi   { fill: #ffa657; font-size: 11px; font-weight: 700; }
    .dim  { fill: #8b949e; font-size: 11px; }
    .cnum{ fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .cc  { fill: #cf222e; stroke: #ffffff; stroke-width: 1.2; }
    .clbl{ fill: #a40e26; font-size: 10.5px; font-weight: 700; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) { .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; } .clbl { fill: #ff7b72; } }
  </style>
  <text class="h1"  x="20" y="26">C2 operator console (Kali terminal)</text>
  <text class="sub" x="20" y="44">Listing the active beacons from the compromised lab hosts.</text>

  <rect class="term" x="20" y="58" width="620" height="414" rx="7"/>
  <rect class="bar"  x="20" y="58" width="620" height="26" rx="7"/>
  <circle cx="36" cy="71" r="4.5" fill="#ff5f56"/>
  <circle cx="52" cy="71" r="4.5" fill="#ffbd2e"/>
  <circle cx="68" cy="71" r="4.5" fill="#27c93f"/>
  <text class="mono dim" x="300" y="75">kali@kali: ~/op</text>

  <text class="mono p1" x="34" y="106">┌──(kali㉿kali)-[~/op]</text>
  <text class="mono p2" x="34" y="124">└─$ <tspan class="cmd">c2client</tspan></text>
  <text class="mono dim" x="34" y="146">[*] Connected to team server over mTLS</text>

  <text class="mono p1" x="34" y="176">┌──(kali㉿kali)-[~/op]</text>
  <text class="mono p2" x="34" y="194">└─$ <tspan class="cmd">sessions</tspan></text>
  <text class="mono hdr" x="34" y="216">ID       USER        HOST        LAST       SLEEP</text>
  <text class="mono out" x="34" y="236">a1f3  vbunnylab\jdoe  WS-FIN01   8s ago   </text>
  <text class="mono hi"  x="470" y="236">3600s</text>
  <text class="mono out" x="34" y="256">b7c2  vbunnylab\svc   SRV-APP01  41s ago  </text>
  <text class="mono hi"  x="470" y="256">3600s</text>
  <text class="mono dim" x="34" y="278">2 beacons, jitter 37 percent</text>

  <text class="mono p1" x="34" y="308">┌──(kali㉿kali)-[~/op]</text>
  <text class="mono p2" x="34" y="326">└─$ <tspan class="cmd">use a1f3</tspan></text>
  <text class="mono dim" x="34" y="348">[*] Active session a1f3 (WS-FIN01)</text>
  <text class="mono out" x="34" y="368">[*] Checking in every 60 min, jittered.</text>
  <text class="mono out" x="34" y="388">[*] Patience beats speed. Low and slow.</text>
  <text class="mono p1" x="34" y="418">┌──(kali㉿kali)-[~/op]</text>
  <text class="mono p2" x="34" y="436">└─$ <tspan class="cmd">_</tspan></text>

  <!-- callouts -->
  <circle class="cc" cx="520" cy="236" r="12"/><text class="cnum" x="520" y="240">1</text>
  <circle class="cc" cx="520" cy="256" r="12"/><text class="cnum" x="520" y="260">1</text>
  <circle class="cc" cx="110" cy="326" r="12"/><text class="cnum" x="110" y="330">2</text>

  <text class="clbl" x="662" y="238">1  A one-hour</text>
  <text class="clbl" x="662" y="254">sleep with jitter.</text>
  <text class="clbl" x="662" y="270">Low and slow</text>
  <text class="clbl" x="662" y="286">beats volume</text>
  <text class="clbl" x="662" y="302">detection, but a</text>
  <text class="clbl" x="662" y="318">hunt on the</text>
  <text class="clbl" x="662" y="334">rhythm still finds it.</text>

  <text class="clbl" x="662" y="370">2  Select a beacon</text>
  <text class="clbl" x="662" y="386">to interact with.</text>

  <text class="foot" x="20" y="494"> No payload or exploit code is shown. The tool is an open-source red team framework.</text>
</svg>
