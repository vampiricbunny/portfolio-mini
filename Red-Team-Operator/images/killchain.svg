<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="t d">
  <title id="t">The operation kill chain, with the detection point marked</title>
  <desc id="d">Seven stages left to right: phishing for initial access, execution of the payload, credential access, lateral movement, reaching the objective host, and staging the data. A marker between credential access and lateral movement shows where the defence first detected the operation, well before the objective. Each stage is tagged quiet or noisy. A note gives the dwell time before detection.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11.5px; }
    .st { fill: #ffe0de; stroke: #cf222e; stroke-width: 1.4; }
    .stq{ fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.3; }
    .nm { fill: #1f2328; font-size: 11px; font-weight: 700; }
    .d  { fill: #57606a; font-size: 9px; }
    .tag{ fill: #1a7f37; font-size: 9px; font-weight: 700; }
    .tagn{ fill: #a40e26; font-size: 9px; font-weight: 700; }
    .flow{ stroke: #656d76; stroke-width: 2; fill: none; marker-end: url(#a); }
    .arrow{ fill: #656d76; }
    .detect{ fill: #d4a72c; }
    .detectt{ fill: #1f2328; font-size: 10px; font-weight: 700; text-anchor: middle; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; }
      .st { fill: #3d1417; stroke: #f85149; } .stq { fill: #161b22; stroke: #6e7681; }
      .nm { fill: #e6edf3; } .d { fill: #8b949e; } .tag { fill: #56d364; } .tagn { fill: #ff7b72; }
      .flow { stroke: #8b949e; } .arrow { fill: #8b949e; } .detectt { fill: #1f2328; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker>
  </defs>
  <text class="h1"  x="24" y="30">The operation, and where it was caught</text>
  <text class="sub" x="24" y="49">The adversary reached the objective. The defence saw them well before impact.</text>

  <!-- 6 stage boxes -->
  <rect class="stq" x="24"  y="120" width="124" height="74" rx="7"/>
  <text class="nm" x="36" y="144">Phishing</text><text class="d" x="36" y="160">initial access</text><text class="tagn" x="36" y="184">logged</text>
  <rect class="st"  x="164" y="120" width="124" height="74" rx="7"/>
  <text class="nm" x="176" y="144">Execution</text><text class="d" x="176" y="160">payload runs</text><text class="tagn" x="176" y="184">noisy, caught</text>
  <rect class="st"  x="304" y="120" width="124" height="74" rx="7"/>
  <text class="nm" x="316" y="144">Cred access</text><text class="d" x="316" y="160">LSASS</text><text class="tagn" x="316" y="184">caught fast</text>
  <rect class="stq" x="500" y="120" width="124" height="74" rx="7"/>
  <text class="nm" x="512" y="144">Lateral move</text><text class="d" x="512" y="160">to app server</text><text class="tag" x="512" y="184">mostly quiet</text>
  <rect class="stq" x="640" y="120" width="104" height="74" rx="7"/>
  <text class="nm" x="652" y="144">Objective</text><text class="d" x="652" y="160">reach SQL</text><text class="tag" x="652" y="184">quiet</text>
  <rect class="stq" x="756" y="120" width="80" height="74" rx="7"/>
  <text class="nm" x="766" y="144">Stage</text><text class="d" x="766" y="160">exfil prep</text><text class="tagn" x="766" y="184">hunt</text>

  <line class="flow" x1="148" y1="157" x2="162" y2="157"/>
  <line class="flow" x1="288" y1="157" x2="302" y2="157"/>
  <line class="flow" x1="428" y1="157" x2="498" y2="157"/>
  <line class="flow" x1="624" y1="157" x2="638" y2="157"/>
  <line class="flow" x1="744" y1="157" x2="754" y2="157"/>

  <!-- detection marker between cred access and lateral -->
  <rect class="detect" x="436" y="128" width="58" height="58" rx="29"/>
  <text class="detectt" x="465" y="152">BLUE</text>
  <text class="detectt" x="465" y="166">SAW</text>
  <text class="detectt" x="465" y="180">IT</text>

  <text class="foot" x="24" y="250">Dwell time before the first high-confidence detection: 2 days 7 hours, at credential access, long before the database was reached.</text>
  <text class="foot" x="24" y="270">The defence did its job. The four stages that stayed quiet became the four detections the SOC shipped afterward.</text>
</svg>
