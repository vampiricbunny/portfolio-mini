<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="t d">
  <title id="t">The C2 infrastructure, redirectors and operator</title>
  <desc id="d">The command and control infrastructure. The operator on Kali connects to a team server. In front of the team server sit redirectors, which the victim beacon talks to, so the real server stays hidden and survives takedown. The beacon on the compromised host talks only to the redirector over traffic shaped to look normal. Each layer is labelled with the detection opportunity it still leaves for the blue team. A note states every evasion choice is also a detection opportunity.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11.5px; }
    .kali{ fill: #24292f; stroke: #57606a; stroke-width: 1.4; }
    .team{ fill: #ffe0de; stroke: #cf222e; stroke-width: 1.5; }
    .redir{ fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.4; }
    .victim{ fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .kn { fill: #ffffff; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .ki { fill: #d0d7de; font-size: 9.5px; text-anchor: middle; }
    .nm { fill: #1f2328; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .d  { fill: #57606a; font-size: 9.5px; text-anchor: middle; }
    .flow{ stroke: #656d76; stroke-width: 2; fill: none; marker-end: url(#a); }
    .arrow{ fill: #656d76; }
    .det{ fill: #9a6700; font-size: 9.5px; font-style: italic; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; }
      .team { fill: #3d1417; stroke: #f85149; } .redir { fill: #4a3808; stroke: #d29922; } .victim { fill: #0c2d6b; stroke: #58a6ff; }
      .nm { fill: #e6edf3; } .d { fill: #8b949e; } .flow { stroke: #8b949e; } .arrow { fill: #8b949e; } .det { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker>
  </defs>
  <text class="h1"  x="24" y="30">Command and control infrastructure</text>
  <text class="sub" x="24" y="49">Built to hide the operator and blend in. Each layer still leaves a detection opportunity.</text>

  <!-- victim -->
  <rect class="victim" x="40" y="150" width="160" height="70" rx="7"/>
  <text class="nm" x="120" y="180">Beacon</text><text class="d" x="120" y="198">on a compromised host</text>
  <text class="det" x="56" y="238">detect: low-and-slow</text>
  <text class="det" x="56" y="252">beacon pattern</text>

  <!-- redirector -->
  <rect class="redir" x="280" y="150" width="160" height="70" rx="7"/>
  <text class="nm" x="360" y="180">Redirector</text><text class="d" x="360" y="198">young domain, HTTPS</text>
  <text class="det" x="292" y="238">detect: beaconing to</text>
  <text class="det" x="292" y="252">a newly seen domain</text>

  <!-- team server -->
  <rect class="team" x="520" y="150" width="160" height="70" rx="7"/>
  <text class="nm" x="600" y="180">Team server</text><text class="d" x="600" y="198">hidden, survives takedown</text>

  <!-- operator -->
  <rect class="kali" x="520" y="60" width="160" height="60" rx="7"/>
  <text class="kn" x="600" y="86">Operator (Kali)</text><text class="ki" x="600" y="104">drives the beacons</text>

  <line class="flow" x1="200" y1="185" x2="278" y2="185"/>
  <text class="d" x="240" y="176">shaped traffic</text>
  <line class="flow" x1="440" y1="185" x2="518" y2="185"/>
  <line class="flow" x1="600" y1="150" x2="600" y2="122"/>

  <text class="det" x="700" y="180">the beacon never</text>
  <text class="det" x="700" y="194">talks to the real</text>
  <text class="det" x="700" y="208">server directly</text>

  <text class="foot" x="24" y="318">Every evasion choice is paired with its detection, because to a defender this diagram is not a build guide. It is a to-do list.</text>
  <text class="foot" x="24" y="338">Hide the server, and blue watches the redirector. Shape the traffic, and blue profiles the rhythm. There is always a tell.</text>
</svg>
