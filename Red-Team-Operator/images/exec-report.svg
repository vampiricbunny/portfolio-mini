<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="t d">
  <title id="t">The executive report</title>
  <desc id="d">A one-page executive summary of the red team operation. A headline states an adversary like those targeting the industry reached the database but was caught before impact. Three stat tiles show dwell time before detection, techniques detected, and data lost which is none. A short list gives the top three improvements.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .app { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .bar { fill: #1f2937; }
    .tile{ fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
    .h1 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub{ fill: #656d76; font-size: 11px; }
    .appt{ fill: #ffffff; font-size: 12px; font-weight: 700; }
    .head{ fill: #1f2328; font-size: 15px; font-weight: 700; }
    .headx{ fill: #656d76; font-size: 11.5px; }
    .tl { fill: #57606a; font-size: 10.5px; }
    .big{ fill: #1f2328; font-size: 26px; font-weight: 700; }
    .good{ fill: #2ea043; font-size: 26px; font-weight: 700; }
    .warn{ fill: #e16f24; font-size: 26px; font-weight: 700; }
    .imp{ fill: #1f2328; font-size: 11px; }
    .num{ fill: #0550ae; font-size: 11px; font-weight: 700; }
    .foot{ fill: #656d76; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .h1 { fill: #e6edf3; } .sub { fill: #8b949e; } .foot { fill: #8b949e; }
      .app { fill: #0d1117; stroke: #30363d; } .tile { fill: #161b22; stroke: #30363d; }
      .head { fill: #e6edf3; } .headx { fill: #8b949e; } .tl { fill: #8b949e; } .big { fill: #e6edf3; }
      .imp { fill: #e6edf3; } .num { fill: #79c0ff; }
    }
  </style>
  <text class="h1"  x="20" y="26">Executive report</text>
  <text class="sub" x="20" y="44">The result as a board reads it: business risk, not techniques.</text>

  <rect class="app" x="20" y="58" width="780" height="356" rx="6"/>
  <rect class="bar" x="20" y="58" width="780" height="28" rx="6"/>
  <text class="appt" x="36" y="77">Red team operation  &gt;  Executive summary</text>

  <text class="head"  x="36" y="116">An adversary reached our database. We caught them before impact.</text>
  <text class="headx" x="36" y="138">The kind of attacker that encrypts a company usually spends days inside first. This exercise proves we shorten those days.</text>

  <!-- stat tiles -->
  <rect class="tile" x="36"  y="160" width="240" height="96" rx="6"/>
  <text class="tl" x="52" y="184">Dwell before we detected</text>
  <text class="warn" x="52" y="222">2d 7h</text>
  <text class="tl" x="52" y="244">caught at credential theft</text>

  <rect class="tile" x="292" y="160" width="240" height="96" rx="6"/>
  <text class="tl" x="308" y="184">Techniques detected</text>
  <text class="big" x="308" y="222">10 / 14</text>
  <text class="tl" x="308" y="244">gaps now closed</text>

  <rect class="tile" x="548" y="160" width="236" height="96" rx="6"/>
  <text class="tl" x="564" y="184">Business data lost</text>
  <text class="good" x="564" y="222">None</text>
  <text class="tl" x="564" y="244">stopped before encryption</text>

  <!-- improvements -->
  <text class="head" x="36" y="294" font-size="13">Top three improvements, already shipped</text>
  <text class="num" x="36" y="320">1</text><text class="imp" x="54" y="320">Detect the quiet data staging that preceded exfiltration.</text>
  <text class="num" x="36" y="344">2</text><text class="imp" x="54" y="344">Alert on beaconing to newly seen domains, to catch the C2 sooner.</text>
  <text class="num" x="36" y="368">3</text><text class="imp" x="54" y="368">Shorten dwell time with a hunt for low-and-slow connection patterns.</text>

  <text class="foot" x="20" y="430"> The board remembers one line: we catch the ransomware crews before they encrypt.</text>
</svg>
